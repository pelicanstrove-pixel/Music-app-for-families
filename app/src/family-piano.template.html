<!--
  Family Piano – main app (UI-SPEC draft v1, side-menu layout).
  This is the SOURCE template. Do not paste this file; run `python3 app/build.py`
  and paste app/family-piano.html into a Squarespace Code block.
  All CSS is scoped under #fp-app. All on-screen wording is in the TEXT table below
  so an educator can rewrite it. Progress lives in this browser only (localStorage).
-->
<style>
/* Nunito, SIL Open Font License 1.1 (app/fonts/OFL.txt). Embedded by app/build.py: no font server is contacted. */
@font-face{font-family:"FP Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(data:font/woff2;base64,/*__FP_FONT__*/) format("woff2")}
#fp-app{--navy:#1d3b5c;--blue:#1b6a8c;--yellow:#ffc83d;--text:#1d2b3a;--bg:#f2f7fb;--line:#d5e2ec;
  --t-blue:#cfe8f5;--t-amber:#ffe3a3;--t-green:#d9f0dd;--t-pink:#f3d6ee;
  font-family:"FP Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45;color:var(--text);
  display:flex;min-height:640px;background:var(--bg);border-radius:12px;overflow:hidden;text-align:left;box-sizing:border-box}
#fp-app *,#fp-app *::before,#fp-app *::after{box-sizing:border-box}
#fp-app h1,#fp-app h2,#fp-app h3,#fp-app p{margin:0;font-family:inherit;color:inherit;letter-spacing:normal;text-transform:none}
#fp-app h1{font-size:28px;font-weight:800;line-height:1.2}
#fp-app h2{font-size:20px;font-weight:800}
#fp-app h3{font-size:17px;font-weight:800}
#fp-app button,#fp-app input,#fp-app select{font-family:inherit;font-size:16px;color:inherit}
#fp-app a{color:var(--blue)}
#fp-app :focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#fp-app .fp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#fp-app > #fp-side{display:flex;flex:0 0 220px}
#fp-app > #fp-side > .fp-side{flex:1}
:is(#fp-app,#fp-printout) .fp-paper blockquote{margin:0 0 .6em;padding-left:.6em;border-left:2px solid #000}
:is(#fp-app,#fp-printout) .fp-paper hr{border:0;border-top:1px solid #000;margin:.8em 0}

/* sidebar */
#fp-app .fp-side{width:220px;flex:0 0 220px;background:var(--navy);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:16px}
#fp-app .fp-logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
#fp-app .fp-logo span{background:var(--yellow);color:var(--navy);border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center}
#fp-app .fp-chip-child{background:rgba(255,255,255,.1);border-radius:10px;padding:10px}
#fp-app .fp-chip-child b{display:block;font-size:17px}
#fp-app .fp-chip-child small{opacity:.85;font-size:13px;display:block}
#fp-app .fp-side label{font-size:13px;opacity:.9;display:block;margin-top:8px}
#fp-app .fp-side select{width:100%;min-height:44px;border-radius:8px;border:0;padding:0 8px;margin-top:4px;background:#fff;color:var(--text)}
#fp-app .fp-nav{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
#fp-app .fp-nav button{width:100%;min-height:44px;text-align:left;background:transparent;border:0;color:#fff;border-radius:8px;padding:0 12px;font-weight:700;cursor:pointer}
#fp-app .fp-nav button:hover{background:rgba(255,255,255,.1)}
#fp-app .fp-nav button[aria-current="page"]{background:var(--yellow);color:var(--navy)}
#fp-app .fp-side-foot{margin-top:auto;font-size:13px;display:flex;flex-direction:column;gap:8px}
#fp-app .fp-side-foot .fp-backup-note{background:rgba(255,255,255,.1);border-radius:8px;padding:8px}
#fp-app .fp-side-foot .fp-backup-note.fp-warn{background:var(--yellow);color:var(--navy)}
#fp-app .fp-side-foot button.fp-link{background:none;border:0;color:#fff;text-decoration:underline;padding:0;min-height:44px;text-align:left;cursor:pointer;font-weight:700}

/* main */
#fp-app .fp-main{flex:1;min-width:0;padding:24px 28px}
#fp-app .fp-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
#fp-app .fp-head p{width:100%;color:#4a5a6a}
#fp-app .fp-draft{background:var(--yellow);color:var(--navy);font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px;white-space:nowrap}
#fp-app .fp-ph{color:#6a7a8a;font-style:italic}
#fp-app .fp-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
#fp-app .fp-grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#fp-app .fp-strand h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#fp-app .fp-strand ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#fp-app .fp-check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
#fp-app .fp-check input{width:24px;height:24px;flex:0 0 24px;accent-color:var(--blue);margin:0}
#fp-app .fp-btn{min-height:44px;border-radius:10px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
#fp-app .fp-btn.fp-primary{background:var(--blue);color:#fff}
#fp-app .fp-btn.fp-yellow{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
#fp-app .fp-btn.fp-danger{border-color:#a33;color:#a33}
#fp-app .fp-btn:disabled{opacity:.5;cursor:not-allowed}
#fp-app .fp-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#fp-app .fp-stack{display:flex;flex-direction:column;gap:14px}
#fp-app .fp-dots{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
#fp-app .fp-dots li{width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--blue);background:#fff}
#fp-app .fp-dots li.fp-done{background:var(--blue);color:#fff}
#fp-app .fp-dots li.fp-now{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
#fp-app .fp-banner{background:var(--t-amber);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
#fp-app .fp-banner.fp-ok{background:var(--t-green)}

/* all 12 weeks */
#fp-app .fp-weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0}
#fp-app .fp-week{border-radius:12px;padding:12px;min-height:96px;border:2px solid var(--line);background:#fff}
#fp-app .fp-week b{display:block;font-size:18px}
#fp-app .fp-week .fp-state{font-size:13px;font-weight:800}
#fp-app .fp-week.fp-done{background:var(--t-green);border-color:var(--t-green)}
#fp-app .fp-week.fp-now{border-color:var(--yellow);background:#fff8e1}
#fp-app .fp-week.fp-soon{opacity:.7}

/* reader mode */
#fp-app .fp-reader{font-size:26px;line-height:1.3}
#fp-app .fp-reader ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
#fp-app .fp-step{display:flex;align-items:center;gap:16px;background:#fff;border-radius:14px;padding:14px 18px;border:2px solid var(--line)}
#fp-app .fp-step.fp-done{background:var(--t-green);border-color:var(--t-green)}
#fp-app .fp-step .fp-num{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
#fp-app .fp-step .fp-icon{font-size:36px}
#fp-app .fp-step .fp-txt{flex:1}
#fp-app .fp-step .fp-check{font-size:20px;font-weight:800}
#fp-app .fp-step .fp-check input{width:32px;height:32px;flex-basis:32px}
#fp-app .fp-stars{font-size:40px;letter-spacing:4px}

/* toddler mode */
#fp-app .fp-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
#fp-app .fp-tile{aspect-ratio:1/1;border-radius:22px;border:4px solid transparent;font-size:72px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
#fp-app .fp-tile[aria-pressed="true"]{border-color:var(--navy)}
#fp-app .fp-tile[aria-pressed="true"]::after{content:"\2714";position:absolute;right:12px;top:8px;font-size:40px;color:var(--navy)}
#fp-app .fp-cue{background:var(--t-amber);border-radius:12px;padding:12px 16px;margin-bottom:16px}

/* print screen */
#fp-app .fp-printwrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
#fp-app fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px;background:#fff}
#fp-app legend{font-weight:800;padding:0 4px}
:is(#fp-app,#fp-printout) .fp-paper{background:#fff;color:#000;width:100%;max-width:8.5in;aspect-ratio:8.5/11;padding:.5in;box-shadow:0 2px 10px rgba(0,0,0,.15);font-family:Arial,Helvetica,sans-serif;font-size:13px;overflow:hidden}
:is(#fp-app,#fp-printout) .fp-paper.fp-lg{font-size:18px}
:is(#fp-app,#fp-printout) .fp-paper h2{font-size:1.6em;margin-bottom:.4em;font-family:Arial,Helvetica,sans-serif}
:is(#fp-app,#fp-printout) .fp-paper h3{font-size:1.15em;margin:.8em 0 .3em;font-family:Arial,Helvetica,sans-serif}
:is(#fp-app,#fp-printout) .fp-paper .fp-nameline{display:flex;gap:2em;margin-bottom:1em}
:is(#fp-app,#fp-printout) .fp-paper .fp-nameline span{flex:1;border-bottom:1px solid #000;padding-bottom:2px}
:is(#fp-app,#fp-printout) .fp-paper table{border-collapse:collapse;width:100%}
:is(#fp-app,#fp-printout) .fp-paper td,:is(#fp-app,#fp-printout) .fp-paper th{border:1px solid #000;padding:.35em;text-align:left;vertical-align:top}
:is(#fp-app,#fp-printout) .fp-paper .fp-box{display:inline-block;width:1em;height:1em;border:1px solid #000;vertical-align:middle;margin-right:.4em}
:is(#fp-app,#fp-printout) .fp-paper .fp-pagebreak{border-top:1px dashed #000;margin:1.2em 0 .6em;padding-top:.4em;font-weight:bold}
:is(#fp-app,#fp-printout) .fp-paper .fp-foot{margin-top:1.5em;font-size:.8em}

/* pieces */
#fp-app .fp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
#fp-app .fp-chips button{min-height:44px;border-radius:999px;border:2px solid var(--blue);background:#fff;color:var(--blue);padding:0 16px;font-weight:700;cursor:pointer}
#fp-app .fp-chips button[aria-pressed="true"]{background:var(--blue);color:#fff}
#fp-app .fp-piece{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
#fp-app .fp-weekchip{background:var(--t-blue);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
#fp-app .fp-reviewchip{background:var(--t-amber);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;cursor:help}
#fp-app .fp-piece[hidden]{display:none}
#fp-app .fp-loading{font-size:14px;font-style:italic}
#fp-app .fp-note{background:var(--t-amber);border-radius:12px;padding:10px 14px;margin:0 0 12px}
#fp-app .fp-search{width:100%;max-width:420px;font:inherit;padding:8px 12px;border:2px solid currentColor;border-radius:10px;background:transparent;color:inherit}

/* family */
#fp-app .fp-kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
#fp-app .fp-bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
#fp-app .fp-bar i{display:block;height:100%;background:var(--blue)}
#fp-app .fp-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
#fp-app .fp-form label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:4px}
#fp-app .fp-form input,#fp-app .fp-form select{min-height:44px;border:1px solid #9fb3c4;border-radius:8px;padding:0 10px;background:#fff}

/* drill sheet maker (app/drills.html) inside the Print screen: restyle its controls only */
#fp-app #fp-drillhost{overflow-x:auto;margin-top:14px}
#fp-app #pd-drills .pd-controls{background:#fff;border:1px solid var(--line);border-radius:12px;max-width:none;font-family:"FP Nunito",system-ui,Arial,sans-serif;color:var(--text)}
#fp-app #pd-drills .pd-controls input[type=text],#fp-app #pd-drills .pd-controls input[type=number],#fp-app #pd-drills .pd-controls select{min-height:44px;border-radius:8px;border-color:#9fb3c4}
#fp-app #pd-drills .pd-controls label.pd-check{min-height:44px}
#fp-app #pd-drills .pd-controls input[type=checkbox]{width:24px;height:24px;accent-color:var(--blue)}
#fp-app #pd-drills .pd-controls button{min-height:44px;border-radius:10px;border:2px solid var(--blue);color:var(--blue);font-weight:800;font-family:inherit;background:#fff}
#fp-app #pd-drills .pd-controls button.pd-primary{background:var(--blue);color:#fff}

/* placement */
#fp-app .fp-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
#fp-app .fp-steps > li > .fp-card > h2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#fp-app .fp-steps .fp-n{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
#fp-app .fp-ptable{width:100%;border-collapse:collapse;margin-bottom:12px}
#fp-app .fp-ptable caption{text-align:left;font-weight:800;padding:6px 0}
#fp-app .fp-ptable th,#fp-app .fp-ptable td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}
#fp-app .fp-ptable td.fp-c{text-align:center}
#fp-app .fp-ptable input[type=number]{width:80px;min-height:44px;border:1px solid #9fb3c4;border-radius:8px;padding:0 8px}
#fp-app .fp-ptable input[type=radio]{width:24px;height:24px;accent-color:var(--blue);margin:0}
#fp-app .fp-ptable label.fp-rad{display:inline-flex;min-width:44px;min-height:44px;align-items:center;justify-content:center;cursor:pointer}
#fp-app .fp-suggest{background:var(--t-green);border-radius:12px;padding:12px 16px;font-weight:800;font-size:18px}
#fp-app .fp-suggest.fp-none{background:var(--t-amber);font-weight:700;font-size:16px}

/* built-in player */
#fp-app .fp-player{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;margin-top:4px;display:flex;flex-direction:column;gap:10px}
#fp-app .fp-player progress{flex:1;min-width:120px;height:12px;accent-color:var(--blue)}
#fp-app .fp-player input[type=range],#fp-app .fp-range{accent-color:var(--blue);min-height:44px;width:180px;max-width:100%}
#fp-app .fp-player select{min-height:44px;border:1px solid #9fb3c4;border-radius:8px;padding:0 8px;background:#fff}
#fp-app .fp-player .fp-chips{margin:0}
#fp-app #pd-drills .pd-cell button.fp-dplay{position:absolute;right:0;top:0;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;border:2px solid var(--blue);background:#fff;color:var(--blue);font-size:18px;line-height:1;z-index:1}

/* score with note highlighting, and "wait for me" keyboard */
#fp-app .fp-score{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;max-height:440px;overflow:auto}
#fp-app .fp-score svg{width:100%;height:auto;display:block;color:#000}
#fp-app .fp-score g.note{cursor:pointer}
#fp-app .fp-score.fp-sheetbox{max-height:75vh}
#fp-app .fp-score g.fp-on,#fp-app .fp-score g.fp-on *{fill:var(--blue);color:var(--blue)}
#fp-app .fp-score g.fp-next,#fp-app .fp-score g.fp-next *{fill:#b85c00;color:#b85c00}
#fp-app .fp-wstatus{font-weight:800;font-size:18px}
#fp-app .fp-kbdwrap{overflow-x:auto;padding-bottom:6px}
#fp-app .fp-kbd{position:relative;height:150px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#fp-app .fp-kbd button{position:absolute;top:0;padding:0;margin:0;border:1px solid #333;cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
#fp-app .fp-kbd .fp-wk{width:44px;height:150px;background:#fff;color:#555;border-radius:0 0 8px 8px;z-index:1}
#fp-app .fp-kbd .fp-bk{width:30px;height:92px;background:#222;color:#ddd;border-radius:0 0 6px 6px;z-index:2}
#fp-app .fp-kbd .fp-tgt.fp-wk{background:var(--yellow)}
#fp-app .fp-kbd .fp-tgt.fp-bk{background:#c99a1f}
#fp-app .fp-kbd .fp-bad{background:#f4b4b4 !important}
#fp-app .fp-kbd .fp-down{filter:brightness(.85)}

/* checking marks on the score */
#fp-app .fp-score g.fp-ok,#fp-app .fp-score g.fp-ok *{fill:#1e8a3c;color:#1e8a3c}
#fp-app .fp-score g.fp-bad,#fp-app .fp-score g.fp-bad *{fill:#c0392b;color:#c0392b}
#fp-app .fp-score g.fp-miss,#fp-app .fp-score g.fp-miss *{fill:#9aa5b1;color:#9aa5b1}
#fp-app .fp-result{background:var(--t-green);border-radius:12px;padding:10px 14px;font-weight:700}
#fp-app .fp-range-note{font-size:13px;color:#4a5a6a}
#fp-app .fp-range-note.fp-warn{color:#8a4b00;font-weight:700}

/* game */
#fp-app .fp-game{background:#0f2236;border-radius:14px;padding:10px;color:#fff;position:relative;user-select:none;-webkit-user-select:none}
#fp-app .fp-game canvas{display:block;width:100%;height:440px;border-radius:10px;touch-action:none;background:#14304d}
#fp-app .fp-hud{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:4px 4px 10px;font-weight:800}
#fp-app .fp-hud .fp-big{font-size:22px}
#fp-app .fp-hud .fp-gvol{display:flex;align-items:center;gap:6px;font-size:20px}
#fp-app .fp-hud .fp-gvol input{width:110px;accent-color:var(--yellow)}
#fp-app .fp-hud .fp-feedback{min-width:90px;color:var(--yellow)}
#fp-app .fp-sheetlane{position:relative;height:230px;overflow:hidden;background:#fff;border-radius:10px}
#fp-app .fp-sheetlane .fp-strip{position:absolute;left:0;top:10px;height:210px;will-change:transform}
#fp-app .fp-sheetlane .fp-strip svg{height:210px;width:auto;display:block;color:#000}
#fp-app .fp-sheetlane .fp-hitline{position:absolute;top:0;bottom:0;width:4px;background:var(--yellow);left:30%;z-index:2;opacity:.85}
#fp-app .fp-sheetlane g.fp-ok,#fp-app .fp-sheetlane g.fp-ok *{fill:#1e8a3c;color:#1e8a3c}
#fp-app .fp-sheetlane g.fp-bad,#fp-app .fp-sheetlane g.fp-bad *{fill:#c0392b;color:#c0392b}
#fp-app .fp-sheetlane g.fp-miss,#fp-app .fp-sheetlane g.fp-miss *{fill:#9aa5b1;color:#9aa5b1}
#fp-app .fp-sheetlane g.fp-next,#fp-app .fp-sheetlane g.fp-next *{fill:#b85c00;color:#b85c00}
#fp-app .fp-results{background:#fff;color:var(--text);border-radius:12px;padding:16px;margin-top:10px}
#fp-app .fp-results .fp-stars{font-size:44px}
@media (max-width:760px){ #fp-app .fp-game canvas{height:380px} }

/* metronome */
#fp-app .fp-metro{display:flex;flex-direction:column;gap:16px;align-items:stretch}
#fp-app .fp-mbpm{font-size:64px;font-weight:800;line-height:1;text-align:center}
#fp-app .fp-mbpm small{font-size:18px;font-weight:700;display:block;color:#4a5a6a}
#fp-app .fp-mdots{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
#fp-app .fp-mdots li{width:44px;height:44px;border-radius:50%;background:var(--line);transition:transform .05s}
#fp-app .fp-mdots li.fp-acc{border:4px solid var(--navy)}
#fp-app .fp-mdots li.fp-now{background:var(--yellow);transform:scale(1.15)}
#fp-app .fp-mdots li.fp-acc.fp-now{background:var(--blue)}
#fp-app .fp-mrange{width:100%;accent-color:var(--blue);min-height:44px}
#fp-app .fp-side .fp-metrobtn{width:100%;min-height:44px;border-radius:8px;border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;font-weight:800;cursor:pointer;text-align:left;padding:0 10px}
#fp-app .fp-side .fp-metrobtn.fp-on{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}

/* help */
#fp-app details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 14px}
#fp-app summary{min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer}
#fp-app details p{padding-bottom:12px}

/* phone / small tablet */
@media (max-width:760px){
  #fp-app{flex-direction:column}
  #fp-app > #fp-side{flex-basis:auto}
  #fp-app .fp-side{width:100%;flex-basis:auto}
  #fp-app .fp-nav{flex-direction:row;flex-wrap:wrap}
  #fp-app .fp-nav li{flex:1 1 40%}
  #fp-app .fp-main{padding:16px}

/* ---------- state ---------- */
var memoryOnly = false;
function blank(){ return { version:1, children:[], activeId:null, lastBackup:null }; }
function load(){
  try { var raw = localStorage.getItem(STORE_KEY); if (raw) { var s = JSON.parse(raw); if (s && s.version === 1) return s; } }
  catch(e){ memoryOnly = true; }
  return blank();
}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){ memoryOnly = true; } }
var S = load();
if (!S.settings) S.settings = { sound:true, output:"device", volume:0.8 };
["kbd:88", "kbdShift:0", "listen:midi", "anyOctave:"].forEach(function(kv){
  var k = kv.split(":")[0], v = kv.split(":")[1];

});

/* ---------- content helpers ---------- */
function levelById(id){ return CONTENT.levels.levels.filter(function(l){ return l.id === id; })[0]; }
function weekOf(child, n){ var p = CONTENT.paths[child.level]; return p && p.weeks.filter(function(w){ return w.week === n; })[0]; }

function active(){ return S.children.filter(function(c){ return c.id === S.activeId; })[0] || S.children[0] || null; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function txt(value, what){ return value ? esc(value) : '<span class="fp-ph">' + esc(TEXT.ph(what)) + "</span>"; }
function plain(value, what){ return value || TEXT.ph(what); }
function tintFor(i){ return ["var(--t-blue)","var(--t-amber)","var(--t-green)","var(--t-pink)"][i % 4]; }
function weekItems(w){ var out = []; if (!w) return out;
  Object.keys(w.strand_items).forEach(function(k){ w.strand_items[k].forEach(function(it){ out.push({strand:k, item:it}); }); }); return out; }
function daysSince(iso){ if (!iso) return null; return Math.floor((Date.now() - new Date(iso).getTime()) / 864e5); }
function draftChip(show){ return show ? '<span class="fp-draft">' + esc(TEXT.draft) + "</span>" : ""; }
function uid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function weeksDoneCount(c){ return c.complete ? 12 : c.week - 1; }
function nextLevelOf(c){ var lv = levelById(c.level); return CONTENT.levels.levels.filter(function(l){ return l.order === lv.order + 1; })[0] || null; }
function completeView(c){
  var nx = nextLevelOf(c);
  return head(TEXT.allDone, false) + '<div class="fp-card fp-stack"><p class="fp-stars" aria-hidden="true">⭐⭐⭐</p><p>' + txt("", "Next-level advice") + "</p>" +
    '<div class="fp-row">' + (nx ? '<button type="button" class="fp-btn fp-primary" data-act="nextlevel">' + esc(TEXT.nextLevel(nx.name)) + "</button>" : "") +

/* ---------- sidebar ---------- */
function sidebar(c){

    var lv = levelById(c.level);

/* ---------- screens ---------- */
function head(title, draft, sub){

function memoryWarning(){ return memoryOnly ? '<div class="fp-banner" role="alert" style="margin-bottom:14px">' + esc(TEXT.storeBlocked) + "</div>" : ""; }

function screenWeek(c){
  if (c.mode === "reader") return weekReader(c);
  if (c.mode === "toddler") return weekToddler(c);
  if (c.complete && !ui.viewWeek) return completeView(c);
  var n = ui.viewWeek || c.week, past = n !== c.week || c.complete;
  var lv = levelById(c.level), w = weekOf(c, n);
  var cards = lv.strands.map(function(s, i){
    var items = (w.strand_items[s] || []).map(function(it){
      return '<li><label class="fp-check"><input type="checkbox" data-act="tick" data-id="' + esc(it.id) + '"' + (c.done[it.id] ? " checked" : "") + "> " +
        txt(it.topic, "Topic") + "</label></li>";
    }).join("");
    return '<section class="fp-card fp-strand" style="background:' + tintFor(i) + '"><h3><span aria-hidden="true">' + TEXT.icons[s] + "</span>" +
      esc(TEXT.strands[s] || s) + "</h3><ul>" + items + "</ul></section>";
  }).join("");

    var cls = n < c.week ? "fp-done" : n === c.week ? "fp-now" : "";

    return '<li class="' + cls + '" title="' + esc(TEXT.week + " " + n + ": " + st) + '"><span aria-hidden="true">' + n + '</span><span class="fp-sr">' + esc(TEXT.week + " " + n + ": " + st) + "</span></li>";
  }).join("") + "</ol>";
  var back = past ? '<div class="fp-banner"><span>' + esc(TEXT.viewing(n)) + '</span><button type="button" class="fp-btn fp-primary" data-act="backweek">' + esc(TEXT.backToWeek) + "</button></div>" : "";
  return head(TEXT.week + " " + n + " " + TEXT.of12, isDraft(w), "<b>Focus:</b> " + txt(w.focus, "Week focus")) +
    '<div class="fp-stack">' + back + '<div class="fp-grid4">' + cards + "</div>" +
    '<div class="fp-card"><h3>Parent notes</h3><p>' + txt(w.parent_notes, "Parent notes") + "</p></div>" +
    '<div class="fp-card">' + dots + "</div>" +
    '<div class="fp-row"><button type="button" class="fp-btn" data-print="plan">' + esc(TEXT.print) + "</button>" +
    '<button type="button" class="fp-btn" data-print="chart">' + esc(TEXT.practiceChart) + "</button>" +
    (past ? "" : '<button type="button" class="fp-btn fp-primary" data-act="weekdone">' + esc(TEXT.weekDone) + "</button>") + "</div></div>";
}

function range12(){ var a = []; for (var i = 1; i <= 12; i++) a.push(i); return a; }

function readerSteps(c){
  var lv = levelById(c.level), w = weekOf(c, c.week);
  return lv.strands.map(function(s){ var it = (w.strand_items[s] || [])[0]; return {strand:s, item:it}; }).filter(function(x){ return x.item; });
}
function weekReader(c){
  if (c.complete) return completeView(c);
  var w = weekOf(c, c.week), steps = readerSteps(c), got = 0;
  var lis = steps.map(function(x, i){
    var done = !!c.done[x.item.id]; if (done) got++;

function pState(c){
  if (!c.placement) c.placement = { type: (c.level === "pre-reader" || (c.age && c.age <= 6)) ? "checklist" : "quiz", answers: { quiz:{}, checklist:{} } };
  return c.placement;

function pItems(type){ var out = []; CONTENT.placement[type].sections.forEach(function(sec){ sec.items.forEach(function(it){ out.push({sec:sec, item:it}); }); }); return out; }
function pMetrics(type, ans){
  var m = { answered:0, total:0, sum:0, section:{}, yes:0, usually:0, notYet:0, usuallyIn:{} };
  pItems(type).forEach(function(x){
    var v = ans[x.item.id], sid = x.sec.id; m.total++;
    if (v === undefined || v === "") return; m.answered++;
    if (type === "quiz") {
      if (x.sec.kind === "yesno") { if (v === "yes") m.yes++; }
      else { var n = Number(v) || 0; m.sum += n; m.section[sid] = (m.section[sid] || 0) + n; }
    } else {
      if (v === "usually") { m.usually++; m.usuallyIn[sid] = (m.usuallyIn[sid] || 0) + 1; }
      if (v === "not_yet") m.notYet++;
    }
  });
  return m;

  else if (ui.screen === "game") { G = G && G.result ? G : null; if (document.getElementById("fp-gcanvas")) gamePreview(); gameSheetPreview(); }
  if (!drillHost.hidden) syncDrills(c);
  if (focusHead) { var h = document.getElementById("fp-h1"); if (h) h.focus(); }
}

function go(screen){ if (REC.on) recStop(); MARKS = {}; if (ui.player) { stopAll(); ui.player = null; W = null; } if (G) { gameStop(true); G = null; } listenStop(); ui.screen = screen; ui.msg = ""; ui.sheetOpen = null; ui.sheetMsg = ""; ui.grown = false; ui.viewWeek = null; ui.editing = null; render(true); }

/* Printing: copy the paper to a direct child of <body> and hide the rest of the page
   (works inside a Squarespace page as well as on its own). */
function makePrintout(){
  var paper = viewEl.querySelector(".fp-paper"); if (!paper) return false;
  removePrintout();
  var out = document.createElement("div"); out.id = "fp-printout"; out.innerHTML = paper.outerHTML;
  document.body.appendChild(out); document.documentElement.classList.add("fp-printing"); return true;
}
function removePrintout(){
  var out = document.getElementById("fp-printout"); if (out) out.remove();
  document.documentElement.classList.remove("fp-printing");
}
window.addEventListener("beforeprint", function(){ if (ui.screen === "print" && ui.sheet !== "drill" && !document.getElementById("fp-printout")) makePrintout(); });
window.addEventListener("afterprint", removePrintout);

function exportBackup(){
  S.lastBackup = new Date().toISOString(); save();
  var data = { app:"family-piano", format:1, exported:S.lastBackup, state:S };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "family-piano-backup-" + S.lastBackup.slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  ui.msg = ""; render();
}
function importBackup(file){
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(r.result);
      if (d.app !== "family-piano" || !d.state || !Array.isArray(d.state.children)) throw 0;
      S = d.state; S.version = 1; save(); ui.msg = TEXT.importOk;
    } catch(e){ ui.msg = TEXT.importBad; }
    render();
  };
  r.readAsText(file);
}
function readAloud(c){
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  readerSteps(c).forEach(function(x, i){
    var u = new SpeechSynthesisUtterance("Step " + (i + 1) + ". " + (x.item.topic || TEXT.strands[x.strand]));
    u.lang = "en-US"; window.speechSynthesis.speak(u);
  });
}

root.addEventListener("click", function(e){
  var t = e.target.closest("[data-go],[data-print],[data-act]"); if (!t || t.tagName === "INPUT" || t.tagName === "SELECT") return;
  var c = active();
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.print) { ui.sheet = t.dataset.print; return go("print"); }
  switch (t.dataset.act) {
    case "weekdone":
      if (c.week >= 12) c.complete = true; else c.week++;
      save(); ui.grown = false; render(true); break;
    case "tile": c.done[t.dataset.id] = !c.done[t.dataset.id]; save(); render(); if (c.done[t.dataset.id]) chime(); break;
    case "grown": ui.grown = !ui.grown; render(true); break;
    case "readme": readAloud(c); break;
    case "doprint": ui.msg = t.dataset.pdf ? TEXT.savePdfHint : ""; render(); if (makePrintout()) { window.print(); setTimeout(removePrintout, 1000); } break;
    case "viewweek": ui.viewWeek = parseInt(t.dataset.n, 10); ui.screen = "week"; render(true); break;
    case "backweek": ui.viewWeek = null; render(true); break;
    case "nextlevel": var nx = nextLevelOf(c); if (nx) { c.level = nx.id; c.week = 1; c.complete = false; save(); go("week"); } break;
    case "sheetmusic":
      stopAll(); ui.player = null; W = null; MARKS = {}; ui.sheetMsg = "";
      if (ui.sheetOpen === t.dataset.id) { ui.sheetOpen = null; ui.loadingPiece = null; render(); break; }
      ui.sheetOpen = null;
      var sid = t.dataset.id; withPiece(sid, function(){ ui.sheetOpen = sid; render(); }); break;
    case "sheetprint":
      var sa = assetById(t.dataset.id); ui.sheetMsg = t.dataset.pdf ? TEXT.sheetPdfHint : "";
      if (t.dataset.pdf) render();
      if (sa && sa.score) loadScore(sa).then(function(){ fillScore(sa); printSheet(sa); }, function(){ ui.sheetMsg = TEXT.scoreNone; render(); });
      break;
    case "listen":
      W = null; MARKS = {}; ui.sheetOpen = null;
      if (ui.player && ui.player.id === t.dataset.id) { stopAll(); ui.player = null; ui.loadingPiece = null; render(); break; }
      stopAll(); ui.player = null;
      var lid = t.dataset.id; withPiece(lid, function(){ ui.player = newPlayer(assetById(lid)); render(); }); break;
    case "pplay": ui.player.result = ""; playerStart(false); break;
    case "game": stopAll(); ui.player = null; W = null;
      var gid = t.dataset.id; withPiece(gid, function(){
        ui.game = ui.game && ui.game.id === gid ? ui.game : { id:gid, view:"fall", mode:"practice", hands:"right", speed:70, names:true, diff:"medium" };
        ui.screen = "game"; G = null; render(true); }); break;
    case "gview": ui.game.view = t.dataset.v; G = null; render(); break;
    case "gmode": ui.game.mode = t.dataset.v; G = null; render(); break;
    case "gdiff": var gd = GAME_DIFF[t.dataset.v]; if (gd) { ui.game.diff = t.dataset.v; ui.game.speed = gd.speed; ui.game.names = gd.names; } G = null; render(); break;
    case "glisten": S.settings.listen = t.dataset.v; if (t.dataset.v !== "mic") { LISTEN.micTest = false; micStop(); }
      if (t.dataset.v === "midi" && navigator.requestMIDIAccess && !AU.midi) findMidi(true);
      save(); G = null; render(); break;
    case "ghands": ui.game.hands = t.dataset.v; G = null; render(); break;
    case "gstart": MARKS = {}; gameStart(); break;
    case "recstart": recStart(); break;
    case "recstop": recStop(); break;
    case "csong": composeOpts().songId = t.dataset.id; var sgx = currentSong(c); if (sgx) ["bpm","ts","key","grid"].forEach(function(k){ composeOpts()[k] = sgx[k]; }); render(); break;
    case "cplay": songPlay(currentSong(c), false); break;
    case "cplayw": songPlay(currentSong(c), true); break;
    case "cstop": stopAll(); composeOpts().playing = false; render(); break;
    case "cprint": ui.msg = t.dataset.pdf ? TEXT.savePdfHint : ""; if (t.dataset.pdf) render(); if (makePrintout()) { window.print(); setTimeout(removePrintout, 1000); } break;
    case "cwav": var sw = currentSong(c); ui.msg = TEXT.cWavWait; render();
      songWav(sw).then(function(data){ download(sw.title.replace(/[^\w\- ]+/g, "") + ".wav", data, "audio/wav"); ui.msg = ""; render(); }, function(){ ui.msg = ""; render(); }); break;
    case "gometro": go("metro"); break;
    case "mtoggle": if (METRO.on) metroStop(); else metroStart(); break;
    case "mstep": metroSettings().bpm = Math.max(30, Math.min(240, metroSettings().bpm + Number(t.dataset.v))); save(); render(); break;
    case "mtap": metroTap(); break;
    case "cxml": var sx1 = currentSong(c); download(sx1.title.replace(/[^\w\- ]+/g, "") + ".musicxml", songMusicXML(sx1), "application/vnd.recordare.musicxml+xml"); break;
    case "cmidi": var sx2 = currentSong(c); download(sx2.title.replace(/[^\w\- ]+/g, "") + ".mid", songMidi(sx2), "audio/midi"); break;
    case "cdel": var sx3 = currentSong(c); if (sx3 && confirm(TEXT.cDeleteConfirm(sx3.title))) { c.songs = songsOf(c).filter(function(x){ return x !== sx3; }); composeOpts().songId = null; save(); render(); } break;
    case "gpause": gamePause(); break;
    case "gstop": gameStop(false); break;
    case "mictest":
      if (LISTEN.micTest) { LISTEN.micTest = false; micStop(); render(); }
      else { LISTEN.micTest = true; render(); micStart().then(function(){ var el = document.getElementById("fp-mictest"); if (el) el.textContent = TEXT.micNothing; }, function(){ LISTEN.micTest = false; render(); }); }
      break;
    case "pwaitgo": waitStart(); break;
    case "ppause": playerPause(); break;
    case "pstop": playerStop(); break;
    case "phands": ui.player.hands = t.dataset.v; playerRestartIfPlaying(); break;
    case "findmidi": findMidi(false); break;
    case "testsound": playOnce([[0, 1, 60], [1, 1, 64], [2, 1, 67], [3, 2, 72]], 100); break;
    case "place": S.activeId = t.dataset.id; save(); go("placement"); break;
    case "ptype": pState(c).type = t.dataset.v; save(); render(true); break;
    case "pprint": if (makePrintout()) { window.print(); setTimeout(removePrintout, 1000); } break;
    case "pclear": var ps = pState(c); ps.answers[ps.type] = {}; save(); render(); break;
    case "papply":
      var lvSel = document.getElementById("fp-plevel").value, wkSel = Math.max(1, Math.min(12, parseInt(document.getElementById("fp-pweek").value, 10) || 1));
      var hasProgress = c.week > 1 || c.complete || Object.keys(c.done).some(function(x){ return c.done[x]; });
      if ((lvSel !== c.level || wkSel !== c.week) && hasProgress && !confirm(TEXT.pConfirm(c.name))) break;
      var lvName = (levelById(lvSel) || {}).name || lvSel;
      c.level = lvSel; c.week = wkSel; c.complete = false;
      pState(c).result = { level: lvSel, week: wkSel, date: new Date().toISOString().slice(0, 10), type: pState(c).type };
      save(); ui.msg = TEXT.pDone(c.name, lvName, wkSel); render();
      break;
    case "edit": ui.editing = t.dataset.id; ui.adding = false; render(); break;
    case "filter": ui.filter = t.dataset.f; render(); break;
    case "add": ui.adding = true; render(); break;
    case "cancel": ui.adding = false; ui.editing = null; render(); break;
    case "pick": S.activeId = t.dataset.id; save(); go("week"); break;
    case "remove":
      var k = S.children.filter(function(x){ return x.id === t.dataset.id; })[0];
      if (k && confirm(TEXT.removeConfirm(k.name))) { S.children = S.children.filter(function(x){ return x !== k; }); if (S.activeId === k.id) S.activeId = S.children[0] ? S.children[0].id : null; save(); render(); }
      break;
    case "export": exportBackup(); break;
    case "reset": if (confirm(TEXT.startOverConfirm)) { S = blank(); save(); ui.adding = false; go("family"); } break;
  }
});
root.addEventListener("pointerdown", function(e){
  var k = e.target.closest(".fp-kbd button[data-key]"); if (!k) return;
  e.preventDefault();
  var m = Number(k.dataset.key);
  audioReady().then(function(){ noteAt(m, AU.ctx.currentTime + 0.01, 0.6, 0.8); heard(m, AU.ctx.currentTime, "screen"); }, function(){});
});
root.addEventListener("pointerdown", function(e){ if (e.target.id === "fp-gcanvas") gamePointer(e); });
["pointerup", "pointercancel", "pointerleave"].forEach(function(evn){ root.addEventListener(evn, function(e){
  var k = e.target.closest && e.target.closest(".fp-kbd button[data-key]"); if (k && REC.on && AU.ctx) recNoteOff(Number(k.dataset.key), AU.ctx.currentTime);
}, true); });
root.addEventListener("keydown", function(e){   // keyboard users: Enter/Space on a focused key
  var k = e.target.closest && e.target.closest(".fp-kbd button[data-key]");
  if (k && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); var m = Number(k.dataset.key);
    audioReady().then(function(){ noteAt(m, AU.ctx.currentTime + 0.01, 0.6, 0.8); heard(m, AU.ctx.currentTime, "screen"); }, function(){}); }
});
root.addEventListener("click", function(e){     // tap a note in the score to start from there
  if (!ui.player || !e.target.closest || !e.target.closest("#fp-score")) return;
  // Noteheads are tiny and drawn with <use>, so pick the nearest one within a finger's width.
  var best = null, bestD = 30 * 30;
  document.querySelectorAll("#fp-score g.note").forEach(function(g){
    var r = (g.querySelector(".notehead") || g).getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = g; }
  });
  if (!best) return;
  var a = assetById(ui.player.id), info = a.score && a.score.notes[best.id]; if (!info) return;
  var P = ui.player; P.pos = info[0];
  if (W && W.active) waitStart(); else if (P.playing) playerStart(true); else render();
});
root.addEventListener("input", function(e){   // the tempo slider shows its number while it moves; the piece search filters as you type
  if (e.target.dataset && e.target.dataset.act === "pq") {
    ui.q = e.target.value; var q = ui.q.trim().toLowerCase(), any = false;
    Array.prototype.forEach.call(root.querySelectorAll(".fp-piece"), function(card){ var hit = !q || card.dataset.q.indexOf(q) >= 0; card.hidden = !hit; any = any || hit; });
    return;
  }
  if (e.target.dataset && e.target.dataset.act === "vol") { S.settings.volume = Number(e.target.value); if (AU.master) AU.master.gain.value = S.settings.volume; }
  if (e.target.dataset && e.target.dataset.act === "mbpm") { metroSettings().bpm = Number(e.target.value); var big = document.querySelector("#fp-app .fp-mbpm"); if (big) big.firstChild.nodeValue = e.target.value; }
});
root.addEventListener("change", function(e){
  var t = e.target, c = active(), a = t.dataset.act;
  if (a === "tick") { c.done[t.dataset.id] = t.checked; save(); render(); if (t.checked && c.mode === "reader") chime(); }
  else if (a === "sound") { S.settings.sound = t.checked; if (!t.checked) { stopAll(); ui.player = null; } save(); render(); if (window.__pdDrills) window.__pdDrills.redraw(); }
  else if (a === "vol") { S.settings.volume = Number(t.value); if (AU.master) AU.master.gain.value = S.settings.volume; save(); }
  else if (a === "output") { stopAll(); S.settings.output = t.value; save(); render(); }
  else if (a === "pspeed") { ui.player.speed = Number(t.value); playerRestartIfPlaying(); }
  else if (a === "pfrom" || a === "pto") {
    var P = ui.player; P[a === "pfrom" ? "from" : "to"] = Number(t.value);
    if (P.from > P.to) { if (a === "pfrom") P.to = P.from; else P.from = P.to; }
    P.pos = 0; if (P.playing) playerStart(true); else render();
  }
  else if (a === "ploop") { ui.player.loop = t.checked; playerRestartIfPlaying(); }
  else if (a === "pcount") { ui.player.countIn = t.checked; render(); }
  else if (a === "pcheck") { stopAll(); ui.player.check = t.checked; ui.player.result = ""; render(); }
  else if (a === "kbd") { S.settings.kbd = Number(t.value); if (S.settings.kbd === 88) S.settings.kbdShift = 0; save(); render(); }
  else if (a === "kbdshift") { S.settings.kbdShift = Number(t.value); save(); render(); }
  else if (a === "listen") { S.settings.listen = t.value; if (t.value !== "mic") { LISTEN.micTest = false; micStop(); } save(); render(); }
  else if (a === "anyoct") { S.settings.anyOctave = t.checked; save(); }
  else if (a === "gspeed") { ui.game.speed = Number(t.value); render(); }
  else if (a === "gnames") { ui.game.names = t.checked; }
  else if (["cbpm","cts","ckey","cgrid"].indexOf(a) >= 0) {
    var k2 = { cbpm:"bpm", cts:"ts", ckey:"key", cgrid:"grid" }[a], v2 = a === "cbpm" ? Math.max(40, Math.min(200, Number(t.value) || 80)) : a === "cgrid" ? Number(t.value) : t.value;
    composeOpts()[k2] = v2; var sg2 = currentSong(c); if (sg2) { sg2[k2] = v2; save(); } render();
  }
  else if (a === "ccount") composeOpts().countIn = t.checked;
  else if (a === "gmetro") ui.game.metro = t.checked;
  else if (a === "galong") ui.game.along = t.checked;
  else if (a === "mbpm") { metroSettings().bpm = Number(t.value); save(); render(); }
  else if (a === "mbeats") { metroSettings().beats = Number(t.value); save(); render(); }
  else if (a === "msub") { metroSettings().sub = Number(t.value); save(); render(); }
  else if (a === "msound") { metroSettings().sound = t.value; save(); }
  else if (a === "mvol") { metroSettings().vol = Number(t.value); save(); }
  else if (a === "maccent") { metroSettings().accent = t.checked; save(); render(); }
  else if (a === "cmetro") composeOpts().metro = t.checked;
  else if (a === "ctitle") { var sg3 = currentSong(c); if (sg3) { sg3.title = t.value.trim() || sg3.title; save(); render(); } }
  else if (a === "pwait") { stopAll(); W = null; ui.player.wait = t.checked; render(); }
  else if (a === "palong") { ui.player.along = t.checked; render(); }
  else if (a === "pmetro") { ui.player.metro = t.checked; playerRestartIfPlaying(); }
  else if (a === "learned") { c.learned[t.dataset.id] = t.checked; save(); render(); }
  else if (a === "who") { S.activeId = t.value; save(); go("week"); }
  else if (a === "mode") { c.mode = t.value; save(); go("week"); }
  else if (a === "sheet") { ui.sheet = t.value; render(); }
  else if (a === "opt") { ui.opts[t.dataset.opt] = t.checked; render(); }
  else if (a === "import" && t.files[0]) importBackup(t.files[0]);
  else if (a === "ptype") { pState(c).type = t.value; save(); render(); }
  else if (a === "pans") {
    var st = pState(c); st.answers[st.type][t.dataset.id] = t.type === "number" ? (t.value === "" ? "" : Math.max(0, Number(t.value) || 0)) : t.value;
    save(); ui.msg = ""; document.getElementById("fp-presult").innerHTML = pResultHtml(c);
  }
});
root.addEventListener("submit", function(e){
  var f = e.target; if (f.dataset.form !== "child") return; e.preventDefault();
  var el = f.elements, name = el.namedItem("name").value.trim(); if (!name) return;
  var age = el.namedItem("age").value, level = el.namedItem("level").value, placeFirst = level === "__place";
  if (placeFirst) level = age && parseInt(age, 10) <= 6 ? "pre-reader" : "level-1";
  var mode = el.namedItem("mode").value || (level === "pre-reader" ? "toddler" : "standard");
  var week = Math.max(1, Math.min(12, parseInt(el.namedItem("week").value, 10) || 1));
  var old = S.children.filter(function(x){ return x.id === f.dataset.id; })[0];
  if (old) {
    old.name = name; old.age = age ? parseInt(age, 10) : null; old.mode = mode;
    if (old.level !== level || old.week !== week) old.complete = false;
    old.level = level; old.week = week; save(); ui.editing = null; render(); return;
  }
  var k = { id:uid(), name:name, age:age ? parseInt(age, 10) : null, level:level, mode:mode, week:week, complete:false, done:{}, learned:{} };
  S.children.push(k); S.activeId = k.id; save(); ui.adding = false; go(placeFirst ? "placement" : "week");
});

if (!S.children.length) ui.screen = "family";
render();
})();
</script>
