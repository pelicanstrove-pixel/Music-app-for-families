#fp-app{--navy:#1d3b5c;--blue:#1b6a8c;--yellow:#ffc83d;--text:#1d2b3a;--bg:#f2f7fb;--line:#d5e2ec;
  --t-blue:#cfe8f5;--t-amber:#ffe3a3;--t-green:#d9f0dd;--t-pink:#f3d6ee;
  font-family:"FP Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45;color:var(--text);
  display:flex;min-height:640px;background:var(--bg);border-radius:12px;overflow:hidden;text-align:left;box-sizing:border-box}
#fp-app *,#fp-app *::before,#fp-app *::after{box-sizing:border-box}
#fp-app h1,#fp-app h2,#fp-app h3,#fp-app p{margin:0;font-family:inherit;color:inherit;letter-spacing:normal;text-transform:none}
#fp-app h1{font-size:28px;font-weight:800;line-height:1.2}
#fp-app h2{font-size:20px;font-weight:800}
#fp-app h3{font-size:17px;font-weight:800}
#fp-app button,#fp-app input,#fp-app select{font-family:inherit;font-size:16px;color:inherit}
#fp-app a{color:var(--blue)}
#fp-app :focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#fp-app .fp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#fp-app > #fp-side{display:flex;flex:0 0 220px}

    var ctx = r.getContext();
    var svg = holder.querySelector('svg');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.removeAttribute('width'); svg.removeAttribute('height');
    svg.style.width = '100%'; svg.style.height = '100%';
    cell.appendChild(svg);
    return { ctx: ctx, svg: svg };
  }
  function answerLine(svg, x1, x2, y, answer, size) {
    if (answer == null) el('line', { x1: x1, x2: x2, y1: y, y2: y, stroke: '#000', 'stroke-width': 1.2 }, svg);
    else txt(svg, (x1 + x2) / 2, y - 3, answer, size || 20, { bold: true });
  }
  function noteWithAcc(VF, p, clef, dur) {
    var n = new VF.StaveNote({ clef: clef, keys: [vfKey(p)], duration: dur || 'w' });
    if (p.acc) n.addModifier(new VF.Accidental(p.acc === 1 ? '#' : 'b'), 0);
    return n;
  }
  function drawStaves(VF, ctx, clef, x, y, w, keySig) {
    if (clef !== 'grand') {
      var s = new VF.Stave(x, y, w).addClef(clef);
      if (keySig) s.addKeySignature(keySig);
      s.setContext(ctx).draw();
      return { treble: s, bass: s, top: s, bottom: s };
    }
    var t = new VF.Stave(x, y, w).addClef('treble');
    var b = new VF.Stave(x, y + 80, w).addClef('bass');
    if (keySig) { t.addKeySignature(keySig); b.addKeySignature(keySig); }
    t.setContext(ctx).draw(); b.setContext(ctx).draw();
    new VF.StaveConnector(t, b).setType(VF.StaveConnector.type.BRACE).setContext(ctx).draw();
    new VF.StaveConnector(t, b).setType(VF.StaveConnector.type.SINGLE_LEFT).setContext(ctx).draw();
    return { treble: t, bass: b, top: t, bottom: b };
  }

  function drawNoteNaming(cell, it, key) {
    var VF = Vex.Flow, grand = it.clef === 'grand';
    var W = 170, H = grand ? 250 : 165;
    var s = vfSurface(cell, W, H);
    var st = drawStaves(VF, s.ctx, it.clef, 22, 10, 140);
    var stave = st[it.staff];
    var n = noteWithAcc(VF, it.p, it.staff);
    VF.Formatter.FormatAndDraw(s.ctx, stave, [n]);
    var x = n.getAbsoluteX() + 6;
    answerLine(s.svg, x - 30, x + 30, H - 12, key ? it.answer : null);
  }

  function drawInterval(cell, it, key) {
    var VF = Vex.Flow, W = 210, H = 165;
    var s = vfSurface(cell, W, H);
    var stave = drawStaves(VF, s.ctx, it.clef, 22, 10, 180).top;
    var notes;
    if (it.pres === 'harmonic') {
      var c = new VF.StaveNote({ clef: it.clef, keys: [vfKey(it.lo), vfKey(it.hi)], duration: 'w' });
      [it.lo, it.hi].forEach(function (p, i) { if (p.acc) c.addModifier(new VF.Accidental(p.acc === 1 ? '#' : 'b'), i); });
      notes = [c];
    } else {
      var a = noteWithAcc(VF, it.dir === 'down' ? it.hi : it.lo, it.clef);
      var b = noteWithAcc(VF, it.dir === 'down' ? it.lo : it.hi, it.clef);
      notes = [a, b];
    }
    VF.Formatter.FormatAndDraw(s.ctx, stave, notes);
    answerLine(s.svg, 70, 150, H - 12, key ? it.answer : null);
    if (key) txt(s.svg, 110, H - 0.5, it.answerLong, 10);
  }

  function drawKeySig(cell, it, key) {
    var VF = Vex.Flow, grand = it.clef === 'grand';
    var W = 170, H = grand ? 250 : 165;
    var s = vfSurface(cell, W, H);
    drawStaves(VF, s.ctx, it.clef, 22, 10, 140, it.key);
    if (!it.minor) {
      answerLine(s.svg, 40, 110, H - 12, key ? it.answer : null);
      if (!key) txt(s.svg, 135, H - 14, TEXT.major, 14);
    } else {
      answerLine(s.svg, 30, 95, H - 30, key ? it.answer : null, 16);
      answerLine(s.svg, 30, 95, H - 6, key ? it.answer2 : null, 16);
      if (!key) { txt(s.svg, 125, H - 32, TEXT.major, 13); txt(s.svg, 125, H - 8, TEXT.minor, 13); }
    }
  }

  function drawRhythm(cell, it, key) {
    if (it.sticks) return drawSticks(cell, it, key);
    var VF = Vex.Flow, W = 720, H = 120;
    var s = vfSurface(cell, W, H), ctx = s.ctx;
    var tp = it.time.split('/');
    var staves = [], allNotes = [], x = 25;
    var widths = [370, 320];
    it.measures.forEach(function (groups, mi) {
      var st = new VF.Stave(x, 0, widths[mi]);
      if (mi === 0) st.addTimeSignature(it.time);
      if (mi === it.measures.length - 1) st.setEndBarType(VF.Barline.type.END);
      st.setConfigForLines([{ visible: false }, { visible: false }, { visible: true }, { visible: false }, { visible: false }]);
      st.setContext(ctx).draw();
      x += widths[mi];
      var notes = [], beams = [];
      groups.forEach(function (g) {
        var gn = g.events.map(function (e) {
          var d = e.dur.replace('d', '');
          var keys = ['b/4'];
          var n = new VF.StaveNote({ keys: keys, duration: d, stem_direction: 1 });
          if (e.dur.indexOf('d') > 0 && e.dur !== 'd') VF.Dot.buildAndAttach([n], { all: true });
          n.__count = e.count;
          return n;
        });
        var beamable = gn.filter(function (n, i) { return !g.events[i].rest && /^(8|16)$/.test(g.events[i].dur); });
        if (g.beam && beamable.length > 1) beams.push(new VF.Beam(beamable));
        notes = notes.concat(gn);
      });
      var voice = new VF.Voice({ num_beats: parseInt(tp[0], 10), beat_value: parseInt(tp[1], 10) });
      voice.setMode(VF.Voice.Mode.SOFT);
      voice.addTickables(notes);
      new VF.Formatter().joinVoices([voice]).format([voice], st.getNoteEndX() - st.getNoteStartX() - 15);
      voice.draw(ctx, st);
      beams.forEach(function (b) { b.setContext(ctx).draw(); });
      staves.push(st);
      allNotes.push(notes);
    });
    if (it.tie) {
      var a = allNotes[0][allNotes[0].length - 1], b = allNotes[1][0];
      new VF.StaveTie({ first_note: a, last_note: b, first_indices: [0], last_indices: [0] }).setContext(ctx).draw();
    }
    var y = H - 22;
    allNotes.forEach(function (ns) {
      ns.forEach(function (n) {
        var cx = n.getAbsoluteX() + 6;
        if (key) txt(s.svg, cx, y, n.__count, n.__count.length > 5 ? 11 : 14, { bold: true });
        else el('line', { x1: cx - 9, x2: cx + 9, y1: y + 4, y2: y + 4, stroke: '#000', 'stroke-width': 1 }, s.svg);
      });
    });
  }

  /* Pre-reader stick notation: ta = one stick, ti-ti = two joined sticks, rest = Z-shaped mark. */
  function drawSticks(cell, it, key) {
    var W = 720, H = 120, svg = blankSvg(cell, W, H);
    var x = 40, unit = it.time === '2/4' ? 150 : 75;
    it.measures.forEach(function (groups, mi) {
      groups.forEach(function (g) {
        if (g.name === 'Q') {
          el('line', { x1: x, x2: x, y1: 25, y2: 75, stroke: '#000', 'stroke-width': 4 }, svg);
          if (key) txt(svg, x, 105, g.events[0].count, 16, { bold: true });
        } else if (g.name === 'E2') {
          el('path', { d: 'M' + (x - 12) + ' 75 V25 H' + (x + 12) + ' V75', stroke: '#000', 'stroke-width': 4, fill: 'none' }, svg);
          if (key) txt(svg, x, 105, 'ti ti', 16, { bold: true });
        } else {
          el('path', { d: 'M' + (x - 8) + ' 32 L' + (x + 8) + ' 40 L' + (x - 8) + ' 58 L' + (x + 8) + ' 66', stroke: '#000', 'stroke-width': 4, fill: 'none' }, svg);
          if (key) txt(svg, x, 105, g.events[0].count, 14, { bold: true });
        }
        x += unit;
      });
      var bx = x - unit / 2 + 8;
      el('line', { x1: bx, x2: bx, y1: 15, y2: 85, stroke: '#000', 'stroke-width': mi === it.measures.length - 1 ? 5 : 1.5 }, svg);
      x += 16;
    });
    txt(svg, 12, 58, it.time.split('/')[0], 22, { bold: true });
  }

  function drawKeyboard(cell, it, key, ink) {
    var ww = 26, wh = 110, bw = 16, bh = 68;
    var whites = it.octaves * 7 + 1;
    var W = whites * ww + 20, H = 175, x0 = 10, y0 = 30;
    var svg = blankSvg(cell, W, H);
    var instr = it.task === 'mark-note' ? TEXT.kb['mark-note'].replace('{note}', LETTERS[it.letter]) : TEXT.kb[it.task];
    txt(svg, x0, 18, instr, 15, { anchor: 'start' });
    var pid = 'pd-hatch-' + (++hatchCount);
    if (ink) {
      var pat = el('pattern', { id: pid, width: 5, height: 5, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, el('defs', {}, svg));
      el('line', { x1: 0, y1: 0, x2: 0, y2: 5, stroke: '#000', 'stroke-width': 1.5 }, pat);
    }
    function wx(i) { return x0 + i * ww; }
    function bx(i) { return x0 + (i + 1) * ww - bw / 2; }
    for (var i = 0; i < whites; i++) el('rect', { x: wx(i), y: y0, width: ww, height: wh, fill: '#fff', stroke: '#000', 'stroke-width': 1.2 }, svg);
    for (var j = 0; j < whites - 1; j++) if (BLACK_AFTER.indexOf(j % 7) >= 0)
      el('rect', { x: bx(j), y: y0, width: bw, height: bh, fill: ink ? 'url(#' + pid + ')' : '#000', stroke: '#000', 'stroke-width': 1.2 }, svg);
    function center(m) { return m.white != null ? { x: wx(m.white) + ww / 2, y: y0 + wh - 18, black: false } : { x: bx(m.black) + bw / 2, y: y0 + bh - 14, black: true }; }
    (it.marks || []).forEach(function (m, idx) {
      var c = center(m);
      el('circle', { cx: c.x, cy: c.y, r: 7, fill: c.black ? '#fff' : '#000', stroke: '#000', 'stroke-width': 2 }, svg);
      if (key && it.answerMark === idx) el('circle', { cx: c.x, cy: c.y, r: 13, fill: 'none', stroke: '#000', 'stroke-width': 3 }, svg);
    });
    if (key && (it.task === 'groups2' || it.task === 'groups3')) {
      for (var o = 0; o < it.octaves; o++) {
        var first = it.task === 'groups2' ? 0 : 3, n = it.task === 'groups2' ? 2 : 3;
        var left = bx(o * 7 + first) - 6, right = bx(o * 7 + first + n - 1) + bw + 6;
        el('ellipse', { cx: (left + right) / 2, cy: y0 + bh / 2, rx: (right - left) / 2, ry: bh / 2 + 6, fill: 'none', stroke: '#000', 'stroke-width': 3 }, svg);
      }
    }
    if (key && it.task === 'mark-note') it.answerWhites.forEach(function (w) {
      var cx = wx(w) + ww / 2, cy = y0 + wh - 18;
      el('path', { d: 'M' + (cx - 7) + ' ' + (cy - 7) + ' L' + (cx + 7) + ' ' + (cy + 7) + ' M' + (cx + 7) + ' ' + (cy - 7) + ' L' + (cx - 7) + ' ' + (cy + 7), stroke: '#000', 'stroke-width': 3 }, svg);
    });
    if (it.answer != null) {
      answerLine(svg, x0 + 10, x0 + 110, H - 8, key ? it.answer : null, 18);
    }
  }

  function shape(svg, kind, cx, cy, r, ink) {
    var fill = ink ? '#fff' : '#000', sw = 3;
    if (kind === 'circle') return el('circle', { cx: cx, cy: cy, r: r, fill: fill, stroke: '#000', 'stroke-width': sw }, svg);
    if (kind === 'square') return el('rect', { x: cx - r, y: cy - r, width: 2 * r, height: 2 * r, fill: fill, stroke: '#000', 'stroke-width': sw }, svg);
    if (kind === 'triangle') return el('path', { d: 'M' + cx + ' ' + (cy - r) + ' L' + (cx + r) + ' ' + (cy + r) + ' L' + (cx - r) + ' ' + (cy + r) + ' Z', fill: fill, stroke: '#000', 'stroke-width': sw }, svg);
    if (kind === 'heart') return el('path', { d: 'M' + cx + ' ' + (cy + r) + ' C' + (cx - 2 * r) + ' ' + (cy - r / 3) + ' ' + (cx - r) + ' ' + (cy - 1.6 * r) + ' ' + cx + ' ' + (cy - r / 2) +
      ' C' + (cx + r) + ' ' + (cy - 1.6 * r) + ' ' + (cx + 2 * r) + ' ' + (cy - r / 3) + ' ' + cx + ' ' + (cy + r) + ' Z', fill: fill, stroke: '#000', 'stroke-width': sw }, svg);
    var pts = [];
    for (var i = 0; i < 10; i++) { var a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * 0.45 : r * 1.1; pts.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1)); }
    return el('polygon', { points: pts.join(' '), fill: fill, stroke: '#000', 'stroke-width': sw }, svg);
  }
  function ring(svg, cx, cy, rx, ry) { el('ellipse', { cx: cx, cy: cy, rx: rx, ry: ry, fill: 'none', stroke: '#000', 'stroke-width': 3, 'stroke-dasharray': '8 5' }, svg); }

  function drawPrereader(cell, it, key, ink) {
    var W = 320, H = 210, svg = blankSvg(cell, W, H);
    el('rect', { x: 2, y: 2, width: W - 4, height: H - 4, fill: 'none', stroke: '#000', 'stroke-width': ink ? 1 : 2, rx: 12 }, svg);
    if (it.kind === 'highlow') {
      txt(svg, W / 2, 30, TEXT.pre[it.ask], 18, { bold: true });
      var hx = it.highLeft ? 95 : 225, lx = it.highLeft ? 225 : 95;
      shape(svg, it.shape, hx, 70, 22, ink); shape(svg, it.shape, lx, 165, 22, ink);
      if (key) { var ax = it.ask === 'high' ? hx : lx, ay = it.ask === 'high' ? 70 : 165; ring(svg, ax, ay, 38, 36); }
    } else if (it.kind === 'longshort') {
      txt(svg, W / 2, 30, TEXT.pre[it.ask], 18, { bold: true });
      var ys = it.longTop ? [80, 155] : [155, 80];
      shape(svg, it.shape, 40, ys[0], 14, ink); el('rect', { x: 60, y: ys[0] - 7, width: 230, height: 14, fill: ink ? '#fff' : '#000', stroke: '#000', 'stroke-width': 3 }, svg);
      shape(svg, it.shape, 40, ys[1], 14, ink); el('rect', { x: 60, y: ys[1] - 7, width: 55, height: 14, fill: ink ? '#fff' : '#000', stroke: '#000', 'stroke-width': 3 }, svg);
      if (key) { var ry = it.ask === 'long' ? ys[0] : ys[1], right = it.ask === 'long' ? 300 : 125; ring(svg, (18 + right) / 2, ry, (right - 18) / 2, 24); }
    } else {
      txt(svg, W / 2, 28, TEXT.pre.stepskip, 18, { bold: true });
      var stairs = 4, sw = 50, sh = 24, sx = 60, sy = 150;
      var d = 'M' + sx + ' ' + sy;
      for (var i = 0; i < stairs; i++) d += ' H' + (sx + (i + 1) * sw) + ' V' + (sy - (i + 1) * sh);
      el('path', { d: d, fill: 'none', stroke: '#000', 'stroke-width': 2 }, svg);
      var a = it.start, b2 = it.start + (it.skip ? 2 : 1);
      if (!it.up) { var t = a; a = stairs - 1 - t; b2 = stairs - 1 - (t + (it.skip ? 2 : 1)); }
      [a, b2].forEach(function (s) { shape(svg, it.shape, sx + s * sw + sw / 2, sy - s * sh - 14, 11, ink); });
      txt(svg, 90, 192, 'STEP', 18, { bold: true }); txt(svg, 230, 192, 'SKIP', 18, { bold: true });
      if (key) ring(svg, it.skip ? 230 : 90, 186, 42, 18);
    }
  }

  /* ============================================================
     7. PAGES, CONTROLS, PRINT
     ============================================================ */
  var $ = function (id) { return document.getElementById(id); };
  var ROOT = $('pd-drills');

  function available(level) {
    return DRILLS.filter(function (d) { return LIMITS[d.id][level]; });
  }
  function variantsFor(drill, level) {
    var lim = LIMITS[drill][level];
    if (drill === 'note-naming' || drill === 'intervals' || drill === 'key-signatures') return lim.clefs;
    if (drill === 'rhythm') return lim.syllables;
    if (drill === 'keyboard') return ['mixed'].concat(lim.tasks);
    if (drill === 'prereader') return ['mixed'].concat(lim.kinds);
    return ['mixed'];
  }
  function fill(select, list, names, keep) {
    select.innerHTML = '';
    list.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v.id || v; o.textContent = v.name || names[v] || v;
      select.appendChild(o);
    });
    if (keep && list.some(function (v) { return (v.id || v) === keep; })) select.value = keep;
  }
  function refreshMenus() {
    var level = $('pd-level').value;
    fill($('pd-type'), available(level), {}, $('pd-type').value);
    fill($('pd-variant'), variantsFor($('pd-type').value, level), VARIANT_NAMES, $('pd-variant').value);
  }
  function newSeed() { $('pd-seed').value = 1 + Math.floor(Math.random() * 999999); }

  function settings() {
    var count = Math.max(4, Math.min(24, parseInt($('pd-count').value, 10) || 12));
    $('pd-count').value = count;
    var seed = parseInt($('pd-seed').value, 10);
    if (!(seed >= 1 && seed <= 4294967295)) { newSeed(); seed = parseInt($('pd-seed').value, 10); }
    return { name: $('pd-name').value.trim(), level: $('pd-level').value, drill: $('pd-type').value,
             variant: $('pd-variant').value, count: count, seed: seed,
             large: $('pd-large').checked, ink: $('pd-ink').checked, key: $('pd-key').checked };
  }

  function generate(st) {
    var rng = makeRng(st.seed);
    switch (st.drill) {
      case 'note-naming': return genNoteNaming(rng, st.level, st.variant, st.count);
      case 'intervals': return genIntervals(rng, st.level, st.variant, st.count);
      case 'key-signatures': return genKeySigs(rng, st.level, st.variant, st.count);
      case 'rhythm': return genRhythm(rng, st.level, st.variant, st.count);
      case 'keyboard': return genKeyboard(rng, st.level, st.variant, st.count);
      case 'prereader': return genPrereader(rng, st.level, st.variant, st.count);
    }
    return [];
  }
  var DRAW = { 'note-naming': drawNoteNaming, 'intervals': drawInterval, 'key-signatures': drawKeySig,
               'rhythm': drawRhythm, 'keyboard': drawKeyboard, 'prereader': drawPrereader };

  function sheetCode(st) {
    var lvl = LEVELS.filter(function (l) { return l.id === st.level; })[0].name;
    var drill = DRILLS.filter(function (d) { return d.id === st.drill; })[0].name.split(':')[0];
    return 'Seed ' + st.seed + ' · ' + lvl + ' · ' + drill + ' (' + (VARIANT_NAMES[st.variant] || st.variant) + ') · ' + st.count + ' items';
  }
  function instruction(st) {
    if (st.drill === 'rhythm') {
      if (LIMITS.rhythm[st.level].sticks) return TEXT.instr['rhythm-sticks'];
      return st.variant === 'kodaly' ? TEXT.instr['rhythm-kodaly'] : TEXT.instr.rhythm;
    }
    return TEXT.instr[st.drill];
  }

  function makePage(st, pageNo, pageCount, isKey, cols, rows) {
    var page = document.createElement('section');
    page.className = 'pd-page';
    var head = document.createElement('div'); head.className = 'pd-head';
    var name = st.name ? st.name : '_______________________';
    head.innerHTML = (isKey ? '<div class="pd-keybanner"></div>' : '') +
      '<div class="pd-nameline"><span></span><span>' + TEXT.dateLabel + ' ____________</span></div>' +
      '<div class="pd-title"></div><div class="pd-instr"></div>';
    if (isKey) head.querySelector('.pd-keybanner').textContent = TEXT.keyTitle;
    head.querySelector('.pd-nameline span').textContent = TEXT.nameLabel + ' ' + name;
    head.querySelector('.pd-title').textContent = TEXT.titles[st.drill];
    head.querySelector('.pd-instr').textContent = instruction(st);
    var grid = document.createElement('div'); grid.className = 'pd-grid';
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
    var foot = document.createElement('div'); foot.className = 'pd-foot';
    var left = document.createElement('span'); left.textContent = sheetCode(st) + (isKey ? ' · answer key' : '');
    var right = document.createElement('span');
    right.textContent = (RULES_STATUS === 'approved' ? '' : TEXT.draft + ' · ') + 'Page ' + pageNo + ' of ' + pageCount;
    foot.appendChild(left); foot.appendChild(right);
    page.appendChild(head); page.appendChild(grid); page.appendChild(foot);
    return { page: page, grid: grid };
  }

  function render() {
    var msg = $('pd-msg');
    msg.className = 'pd-msg'; msg.textContent = '';
    if (!window.Vex || !Vex.Flow) {
      msg.className = 'pd-msg pd-error';
      msg.textContent = 'The music drawing library (VexFlow) did not load. Check the internet connection and reload the page.';
      return;
    }
    var st = settings();
    ROOT.classList.toggle('pd-large', st.large);
    ROOT.classList.toggle('pd-ink', st.ink);
    var items = generate(st);
    if (items.length < st.count) msg.textContent = 'Only ' + items.length + ' different items fit these level limits.';
    var lay = st.drill === 'keyboard' && LIMITS.keyboard[st.level].octaves.every(function (o) { return o === 1; }) ? LAYOUT['keyboard-1'] : LAYOUT[st.drill];
    var cr = st.large ? lay.large : lay.normal, per = cr[0] * cr[1];
    var pages = Math.ceil(items.length / per);
    var out = $('pd-sheets');
    out.innerHTML = '';
    var passes = st.key ? [false, true] : [false];
    passes.forEach(function (isKey) {
      for (var p = 0; p < pages; p++) {
        var pg = makePage(st, p + 1, pages, isKey, cr[0], cr[1]);
        out.appendChild(pg.page);
        items.slice(p * per, (p + 1) * per).forEach(function (it, i) {
          var cell = document.createElement('div'); cell.className = 'pd-cell';
          var num = document.createElement('span'); num.className = 'pd-num'; num.textContent = (p * per + i + 1) + '.';
          pg.grid.appendChild(cell);
          DRAW[st.drill](cell, it, isKey, st.ink);
          cell.appendChild(num);
        });
      }
    });
  }

  /* Printing: move the sheets to the top of the page and hide everything else
     (works inside a Squarespace page as well as on its own). */
  var placeholder = null;
  function beforePrint() {
    // Inside the Family Piano app the maker sits in a hidden panel until "Drill sheet" is picked.
    if (placeholder || ROOT.closest('[hidden]')) return;
    placeholder = document.createComment('pd-drills');
    ROOT.parentNode.insertBefore(placeholder, ROOT);
    document.body.appendChild(ROOT);
    document.documentElement.classList.add('pd-printing');
  }
  function afterPrint() {
    if (!placeholder) return;
    placeholder.parentNode.insertBefore(ROOT, placeholder);

/* ----- placement ----- */
function pState(c){
  if (!c.placement) c.placement = { type: (c.level === "pre-reader" || (c.age && c.age <= 6)) ? "checklist" : "quiz", answers: { quiz:{}, checklist:{} } };
  return c.placement;
}
function pItems(type){ var out = []; CONTENT.placement[type].sections.forEach(function(sec){ sec.items.forEach(function(it){ out.push({sec:sec, item:it}); }); }); return out; }
function pMetrics(type, ans){
  var m = { answered:0, total:0, sum:0, section:{}, yes:0, usually:0, notYet:0, usuallyIn:{} };
  pItems(type).forEach(function(x){
    var v = ans[x.item.id], sid = x.sec.id; m.total++;
    if (v === undefined || v === "") return; m.answered++;
    if (type === "quiz") {
      if (x.sec.kind === "yesno") { if (v === "yes") m.yes++; }
      else { var n = Number(v) || 0; m.sum += n; m.section[sid] = (m.section[sid] || 0) + n; }
    } else {
      if (v === "usually") { m.usually++; m.usuallyIn[sid] = (m.usuallyIn[sid] || 0) + 1; }
      if (v === "not_yet") m.notYet++;
    }
  });
  return m;
}
/* Returns {status:"incomplete"} while any rule still has an unwritten (null) condition,
   {status:"ok", rule} for the first rule that matches, or {status:"none"}. */
function pEvaluate(type, m){
  var rules = CONTENT.placement.rules[type === "quiz" ? "reader_quiz" : "prereader_checklist"].rules;
  var unwritten = false;
  function conds(r){
    var list = [];
    function add(v, ok){ if (v === null) unwritten = true; else list.push(ok); }
    if ("min_total" in r) add(r.min_total, function(){ return m.sum >= r.min_total; });
    if ("min_playing_yes" in r) add(r.min_playing_yes, function(){ return m.yes >= r.min_playing_yes; });
    if ("min_usually" in r) add(r.min_usually, function(){ return m.usually >= r.min_usually; });
    if ("max_not_yet" in r) add(r.max_not_yet, function(){ return m.notYet <= r.max_not_yet; });
    Object.keys(r.min_section || {}).forEach(function(k){ add(r.min_section[k], function(){ return (m.section[k] || 0) >= r.min_section[k]; }); });
    Object.keys(r.min_usually_in || {}).forEach(function(k){ add(r.min_usually_in[k], function(){ return (m.usuallyIn[k] || 0) >= r.min_usually_in[k]; }); });
    if (r.suggest === "pre-reader" && r.start_week === null) unwritten = true;
    return list;
  }
  var checked = rules.map(function(r){ return { r:r, c:conds(r) }; });
  if (unwritten) return { status:"incomplete" };
  for (var i = 0; i < checked.length; i++) {
    var x = checked[i];
    if (x.r.always || (x.c.length && x.c.every(function(f){ return f(); }))) return { status:"ok", rule:x.r };
  }
  return { status:"none" };
}
function placementPaper(type, withKey){
  var pl = CONTENT.placement[type];
  return '<div class="fp-paper' + (ui.opts.large ? " fp-lg" : "") + '" aria-label="Paper preview">' + pl.main +
    (withKey && pl.key ? '<div class="fp-pagebreak">' + esc(TEXT.placementKey) + "</div>" + pl.key : "") + "</div>";
}
function pResultHtml(c){
  var st = pState(c), type = st.type, m = pMetrics(type, st.answers[type]);
  var lvId = c.level, wk = 1, msg;
  if (m.answered < m.total) msg = '<p class="fp-suggest fp-none">' + esc(TEXT.pAnswered(m.answered, m.total)) + "</p>";
  else {
    var ev = pEvaluate(type, m);
    if (ev.status === "incomplete") msg = '<p class="fp-suggest fp-none">' + esc(TEXT.pNoRules) + "</p>";
    else if (ev.status === "none") msg = '<p class="fp-suggest fp-none">' + esc(TEXT.pNoMatch) + "</p>";
    else if (ev.rule.suggest === "reader-quiz") msg = '<p class="fp-suggest">' + esc(TEXT.pTryQuizLong) + '</p><p style="margin-top:8px"><button type="button" class="fp-btn fp-primary" data-act="ptype" data-v="quiz">' + esc(TEXT.pTryQuiz) + "</button></p>";
    else {
      lvId = ev.rule.suggest; wk = ev.rule.start_week || 1;
      var sl = levelById(lvId);
      msg = '<p class="fp-suggest">' + esc(TEXT.pSuggest) + " " + esc(sl ? sl.name : lvId) + ", " + esc(TEXT.week.toLowerCase()) + " " + wk + "</p>";
    }
  }
  var opts = CONTENT.levels.levels.slice().sort(function(a,b){ return a.order - b.order; }).map(function(l){
    return '<option value="' + esc(l.id) + '"' + (l.id === lvId ? " selected" : "") + ">" + esc(l.name) + "</option>"; }).join("");
  var last = st.result ? "<p>" + esc(TEXT.pLast(st.result.date, (levelById(st.result.level) || {}).name || st.result.level, st.result.week)) + "</p>" : "";
  return msg + '<div class="fp-form" style="margin-top:12px"><label>Level<select id="fp-plevel">' + opts + "</select></label>" +
    '<label>' + esc(TEXT.week) + '<input id="fp-pweek" type="number" min="1" max="12" value="' + wk + '"></label></div>' +
    '<div class="fp-row" style="margin-top:12px"><button type="button" class="fp-btn fp-primary" data-act="papply">' + esc(TEXT.pUse(c.name)) + "</button></div>" +
    (ui.msg ? '<p role="status" style="margin-top:8px">' + esc(ui.msg) + "</p>" : "") + last;
}
function screenPlacement(c){
  var st = pState(c), type = st.type, ans = st.answers[type];
  var types = Object.keys(TEXT.pTypes).map(function(t){
    return '<label class="fp-check"><input type="radio" name="fp-ptype" value="' + t + '" data-act="ptype"' + (t === type ? " checked" : "") + "> <span><b>" +
      esc(TEXT.pTypes[t]) + "</b><br><small>" + esc(TEXT.pTypeHelp[t]) + "</small></span></label>"; }).join("");
  var choices = type === "quiz" ? null : [["not_yet", TEXT.pNotYet], ["sometimes", TEXT.pSometimes], ["usually", TEXT.pUsually]];
  var max = CONTENT.placement.rules.reader_quiz.points_per_item_max;
  var tables = CONTENT.placement[type].sections.map(function(sec){
    var cols = choices || (sec.kind === "yesno" ? [["yes", TEXT.pYes], ["no", TEXT.pNotYet]] : null);
    var headCols = cols ? cols.map(function(o){ return '<th scope="col" class="fp-c">' + esc(o[1]) + "</th>"; }).join("") : '<th scope="col">' + esc(TEXT.pPoints) + "</th>";
    var rows = sec.items.map(function(it){
      var v = ans[it.id], cells;
      if (cols) cells = cols.map(function(o){
        return '<td class="fp-c"><label class="fp-rad"><input type="radio" name="fp-p-' + esc(it.id) + '" value="' + o[0] + '" data-act="pans" data-id="' + esc(it.id) + '"' + (v === o[0] ? " checked" : "") +
          '><span class="fp-sr">' + esc(it.id + ": " + o[1]) + "</span></label></td>"; }).join("");
      else cells = '<td><input type="number" min="0"' + (max ? ' max="' + max + '"' : "") + ' inputmode="numeric" data-act="pans" data-id="' + esc(it.id) + '" value="' + esc(v === undefined ? "" : v) + '" aria-label="' + esc(it.id + " " + TEXT.pPoints) + '"></td>';
      return '<tr><th scope="row">' + esc(it.id) + "</th><td>" + esc(it.prompt) + "</td>" + cells + "</tr>";
    }).join("");
    return '<table class="fp-ptable"><caption>' + esc(sec.name) + '</caption><thead><tr><th scope="col">#</th><th scope="col">Prompt</th>' + headCols + "</tr></thead><tbody>" + rows + "</tbody></table>";
  }).join("");
  var step = function(i, body){ return '<li><section class="fp-card"><h2><span class="fp-n" aria-hidden="true">' + (i + 1) + "</span>" + esc(TEXT.pSteps[i]) + "</h2>" + body + "</section></li>"; };
  return head(TEXT.placementFor(c.name), true) + '<ol class="fp-steps">' +
    step(0, '<fieldset style="border:0;padding:0;margin:0"><legend class="fp-sr">' + esc(TEXT.pSteps[0]) + "</legend>" + types + "</fieldset>") +
    step(1, '<div class="fp-row"><button type="button" class="fp-btn fp-primary" data-act="pprint">' + esc(TEXT.pPrint) + "</button>" +
      '<label class="fp-check"><input type="checkbox" data-act="opt" data-opt="key"' + (ui.opts.key ? " checked" : "") + "> " + esc(TEXT.printOpts.key) + "</label>" +
      '<label class="fp-check"><input type="checkbox" data-act="opt" data-opt="large"' + (ui.opts.large ? " checked" : "") + "> " + esc(TEXT.printOpts.large) + "</label></div>" +
      '<details style="margin-top:10px"><summary>' + esc(TEXT.pShow) + "</summary>" + placementPaper(type, ui.opts.key) + "</details>") +
    step(2, tables + '<button type="button" class="fp-btn fp-danger" data-act="pclear">' + esc(TEXT.pClear) + "</button>") +
    step(3, '<div id="fp-presult">' + pResultHtml(c) + "</div>") + "</ol>";
}

/* ----- help ----- */
function screenHelp(){
  var modes = Object.keys(TEXT.modes).map(function(m){
    return '<section class="fp-card"><h3>' + esc(TEXT.modes[m]) + "</h3><p>" + txt("", "Who this mode is for") + "</p></section>"; }).join("");
  var levels = CONTENT.levels.levels.map(function(l){
    return "<li><b>" + esc(l.name) + "</b> (ages " + l.age_guide.min + "–" + l.age_guide.max + "): " + txt(l.age_guide.note, "Placement description") + "</li>"; }).join("");
  var faq = [["How do I print?", "Go to Print, pick one sheet, then press Print. To make a PDF, press Save as PDF and choose “Save as PDF” in the print window. Sheets always print in black and white."],
             ["Where is my progress saved?", "Only in this browser on this device. Nothing is sent anywhere. Clearing your browser data deletes it, so save a backup file now and then (Family → Backup & restore)."],
             ["Can I use another device?", "Yes. Save a backup file on this device, move the file to the other device, and use Restore from file there."],
             ["How do I change a child's mode?", "Pick the child, then change Mode in the side menu. Their progress stays the same."]];
  var starts = S.children.map(function(k){ return '<button type="button" class="fp-btn fp-primary" data-act="place" data-id="' + esc(k.id) + '">' + esc(TEXT.pStart(k.name)) + "</button>"; }).join("");
  return head(TEXT.help, true) + '<div class="fp-stack"><h2>Modes</h2><div class="fp-kids">' + modes + "</div>" +
    '<h2>Placement</h2><div class="fp-card"><ul>' + levels + "</ul>" + (starts ? '<div class="fp-row" style="margin-top:10px">' + starts + "</div>" : "") + "</div><h2>Questions</h2>" +
    faq.map(function(f){ return "<details><summary>" + esc(f[0]) + "</summary><p>" + esc(f[1]) + "</p></details>"; }).join("") + "</div>";
}

/* ---------- render ---------- */
var root = document.getElementById("fp-app"), sideEl = document.getElementById("fp-side"),
    viewEl = document.getElementById("fp-view"), drillHost = document.getElementById("fp-drillhost");
var drillSynced = null;
function syncDrills(c){
  var key = c.id + "|" + c.level, n = document.getElementById("pd-name"), l = document.getElementById("pd-level");
  if (drillSynced === key || !n || !l) return;
  drillSynced = key; n.value = c.name; l.value = c.level;
  l.dispatchEvent(new Event("change"));
}
function render(focusHead){
  var c = active();
  if (c && !TEXT.nav[c.mode].some(function(n){ return n[0] === ui.screen; }) && ["help","family","placement"].indexOf(ui.screen) < 0) ui.screen = "week";
  if (c && c.mode === "toddler" && ui.screen === "family" && !ui.grown) ui.screen = "week";
  var body;
  if (!c) body = ui.screen === "help" ? screenHelp() : screenFamily();
  else body = ({week:screenWeek, weeks:screenWeeks, print:screenPrint, pieces:screenPieces, stars:screenStars, family:screenFamily, help:screenHelp, placement:screenPlacement}[ui.screen] || screenWeek)(c);
  sideEl.innerHTML = sidebar(c);
  viewEl.innerHTML = (ui.screen !== "family" ? memoryWarning() : "") + body;
  drillHost.hidden = !(c && ui.screen === "print" && ui.sheet === "drill");
  if (!drillHost.hidden) syncDrills(c);
  if (focusHead) { var h = document.getElementById("fp-h1"); if (h) h.focus(); }
}

function go(screen){ ui.screen = screen; ui.msg = ""; ui.grown = false; ui.viewWeek = null; ui.editing = null; render(true); }

/* Printing: copy the paper to a direct child of <body> and hide the rest of the page
   (works inside a Squarespace page as well as on its own). */
function makePrintout(){
  var paper = viewEl.querySelector(".fp-paper"); if (!paper) return false;
  removePrintout();
  var out = document.createElement("div"); out.id = "fp-printout"; out.innerHTML = paper.outerHTML;
  document.body.appendChild(out); document.documentElement.classList.add("fp-printing"); return true;
}
function removePrintout(){
  var out = document.getElementById("fp-printout"); if (out) out.remove();
  document.documentElement.classList.remove("fp-printing");
}
window.addEventListener("beforeprint", function(){ if (ui.screen === "print" && ui.sheet !== "drill" && !document.getElementById("fp-printout")) makePrintout(); });
window.addEventListener("afterprint", removePrintout);

function exportBackup(){
  S.lastBackup = new Date().toISOString(); save();
  var data = { app:"family-piano", format:1, exported:S.lastBackup, state:S };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "family-piano-backup-" + S.lastBackup.slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  ui.msg = ""; render();
}
function importBackup(file){
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(r.result);
      if (d.app !== "family-piano" || !d.state || !Array.isArray(d.state.children)) throw 0;
      S = d.state; S.version = 1; save(); ui.msg = TEXT.importOk;
    } catch(e){ ui.msg = TEXT.importBad; }
    render();
  };
  r.readAsText(file);
}
function readAloud(c){
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  readerSteps(c).forEach(function(x, i){
    var u = new SpeechSynthesisUtterance("Step " + (i + 1) + ". " + (x.item.topic || TEXT.strands[x.strand]));
    u.lang = "en-US"; window.speechSynthesis.speak(u);
  });
}

root.addEventListener("click", function(e){
  var t = e.target.closest("[data-go],[data-print],[data-act]"); if (!t || t.tagName === "INPUT" || t.tagName === "SELECT") return;
  var c = active();
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.print) { ui.sheet = t.dataset.print; return go("print"); }
  switch (t.dataset.act) {
    case "weekdone":
      if (c.week >= 12) c.complete = true; else c.week++;
      save(); ui.grown = false; render(true); break;
    case "tile": c.done[t.dataset.id] = !c.done[t.dataset.id]; save(); render(); break;
    case "grown": ui.grown = !ui.grown; render(true); break;
    case "readme": readAloud(c); break;
    case "doprint": ui.msg = t.dataset.pdf ? TEXT.savePdfHint : ""; render(); if (makePrintout()) { window.print(); setTimeout(removePrintout, 1000); } break;
    case "viewweek": ui.viewWeek = parseInt(t.dataset.n, 10); ui.screen = "week"; render(true); break;
    case "backweek": ui.viewWeek = null; render(true); break;
    case "nextlevel": var nx = nextLevelOf(c); if (nx) { c.level = nx.id; c.week = 1; c.complete = false; save(); go("week"); } break;
    case "place": S.activeId = t.dataset.id; save(); go("placement"); break;
    case "ptype": pState(c).type = t.dataset.v; save(); render(true); break;
    case "pprint": if (makePrintout()) { window.print(); setTimeout(removePrintout, 1000); } break;
    case "pclear": var ps = pState(c); ps.answers[ps.type] = {}; save(); render(); break;
    case "papply":
      var lvSel = document.getElementById("fp-plevel").value, wkSel = Math.max(1, Math.min(12, parseInt(document.getElementById("fp-pweek").value, 10) || 1));
      var hasProgress = c.week > 1 || c.complete || Object.keys(c.done).some(function(x){ return c.done[x]; });
      if ((lvSel !== c.level || wkSel !== c.week) && hasProgress && !confirm(TEXT.pConfirm(c.name))) break;
      var lvName = (levelById(lvSel) || {}).name || lvSel;
      c.level = lvSel; c.week = wkSel; c.complete = false;
      pState(c).result = { level: lvSel, week: wkSel, date: new Date().toISOString().slice(0, 10), type: pState(c).type };
      save(); ui.msg = TEXT.pDone(c.name, lvName, wkSel); render();
      break;
    case "edit": ui.editing = t.dataset.id; ui.adding = false; render(); break;
    case "filter": ui.filter = t.dataset.f; render(); break;
    case "add": ui.adding = true; render(); break;
    case "cancel": ui.adding = false; ui.editing = null; render(); break;
    case "pick": S.activeId = t.dataset.id; save(); go("week"); break;
    case "remove":
      var k = S.children.filter(function(x){ return x.id === t.dataset.id; })[0];
      if (k && confirm(TEXT.removeConfirm(k.name))) { S.children = S.children.filter(function(x){ return x !== k; }); if (S.activeId === k.id) S.activeId = S.children[0] ? S.children[0].id : null; save(); render(); }
      break;
    case "export": exportBackup(); break;
    case "reset": if (confirm(TEXT.startOverConfirm)) { S = blank(); save(); ui.adding = false; go("family"); } break;
  }
});
root.addEventListener("change", function(e){
  var t = e.target, c = active(), a = t.dataset.act;
  if (a === "tick") { c.done[t.dataset.id] = t.checked; save(); render(); }
  else if (a === "learned") { c.learned[t.dataset.id] = t.checked; save(); render(); }
  else if (a === "who") { S.activeId = t.value; save(); go("week"); }
  else if (a === "mode") { c.mode = t.value; save(); go("week"); }
  else if (a === "sheet") { ui.sheet = t.value; render(); }
  else if (a === "opt") { ui.opts[t.dataset.opt] = t.checked; render(); }
  else if (a === "import" && t.files[0]) importBackup(t.files[0]);
  else if (a === "ptype") { pState(c).type = t.value; save(); render(); }
  else if (a === "pans") {
    var st = pState(c); st.answers[st.type][t.dataset.id] = t.type === "number" ? (t.value === "" ? "" : Math.max(0, Number(t.value) || 0)) : t.value;
    save(); ui.msg = ""; document.getElementById("fp-presult").innerHTML = pResultHtml(c);
  }
});
root.addEventListener("submit", function(e){
  var f = e.target; if (f.dataset.form !== "child") return; e.preventDefault();
  var el = f.elements, name = el.namedItem("name").value.trim(); if (!name) return;
  var age = el.namedItem("age").value, level = el.namedItem("level").value, placeFirst = level === "__place";
  if (placeFirst) level = age && parseInt(age, 10) <= 6 ? "pre-reader" : "level-1";
  var mode = el.namedItem("mode").value || (level === "pre-reader" ? "toddler" : "standard");
  var week = Math.max(1, Math.min(12, parseInt(el.namedItem("week").value, 10) || 1));
  var old = S.children.filter(function(x){ return x.id === f.dataset.id; })[0];
  if (old) {
    old.name = name; old.age = age ? parseInt(age, 10) : null; old.mode = mode;
    if (old.level !== level || old.week !== week) old.complete = false;
    old.level = level; old.week = week; save(); ui.editing = null; render(); return;
  }
  var k = { id:uid(), name:name, age:age ? parseInt(age, 10) : null, level:level, mode:mode, week:week, complete:false, done:{}, learned:{} };
  S.children.push(k); S.activeId = k.id; save(); ui.adding = false; go(placeFirst ? "placement" : "week");
});

if (!S.children.length) ui.screen = "family";
render();
})();
</script>
