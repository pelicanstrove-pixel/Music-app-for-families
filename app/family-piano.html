<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Piano</title>
<!-- BUILT FILE: do not edit. Edit app/src/family-piano.template.html and run python3 app/build.py -->
<!--
  Family Piano – main app (UI-SPEC draft v1, side-menu layout).
  This is the SOURCE template. Do not paste this file; run `python3 app/build.py`
  and paste app/family-piano.html into a Squarespace Code block.
  All CSS is scoped under #fp-app. All on-screen wording is in the TEXT table below
  so an educator can rewrite it. Progress lives in this browser only (localStorage).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
#fp-app{--navy:#1d3b5c;--blue:#1b6a8c;--yellow:#ffc83d;--text:#1d2b3a;--bg:#f2f7fb;--line:#d5e2ec;
  --t-blue:#cfe8f5;--t-amber:#ffe3a3;--t-green:#d9f0dd;--t-pink:#f3d6ee;
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45;color:var(--text);
  display:flex;min-height:640px;background:var(--bg);border-radius:12px;overflow:hidden;text-align:left;box-sizing:border-box}
#fp-app *,#fp-app *::before,#fp-app *::after{box-sizing:border-box}
#fp-app h1,#fp-app h2,#fp-app h3,#fp-app p{margin:0;font-family:inherit;color:inherit;letter-spacing:normal;text-transform:none}
#fp-app h1{font-size:28px;font-weight:800;line-height:1.2}
#fp-app h2{font-size:20px;font-weight:800}
#fp-app h3{font-size:17px;font-weight:800}
#fp-app button,#fp-app input,#fp-app select{font-family:inherit;font-size:16px;color:inherit}
#fp-app a{color:var(--blue)}
#fp-app :focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#fp-app .fp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#fp-app > #fp-side{display:flex;flex:0 0 220px}
#fp-app > #fp-side > .fp-side{flex:1}
:is(#fp-app,#fp-printout) .fp-paper blockquote{margin:0 0 .6em;padding-left:.6em;border-left:2px solid #000}
:is(#fp-app,#fp-printout) .fp-paper hr{border:0;border-top:1px solid #000;margin:.8em 0}

/* sidebar */
#fp-app .fp-side{width:220px;flex:0 0 220px;background:var(--navy);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:16px}
#fp-app .fp-logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
#fp-app .fp-logo span{background:var(--yellow);color:var(--navy);border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center}
#fp-app .fp-chip-child{background:rgba(255,255,255,.1);border-radius:10px;padding:10px}
#fp-app .fp-chip-child b{display:block;font-size:17px}
#fp-app .fp-chip-child small{opacity:.85;font-size:13px;display:block}
#fp-app .fp-side label{font-size:13px;opacity:.9;display:block;margin-top:8px}
#fp-app .fp-side select{width:100%;min-height:44px;border-radius:8px;border:0;padding:0 8px;margin-top:4px;background:#fff;color:var(--text)}
#fp-app .fp-nav{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
#fp-app .fp-nav button{width:100%;min-height:44px;text-align:left;background:transparent;border:0;color:#fff;border-radius:8px;padding:0 12px;font-weight:700;cursor:pointer}
#fp-app .fp-nav button:hover{background:rgba(255,255,255,.1)}
#fp-app .fp-nav button[aria-current="page"]{background:var(--yellow);color:var(--navy)}
#fp-app .fp-side-foot{margin-top:auto;font-size:13px;display:flex;flex-direction:column;gap:8px}
#fp-app .fp-side-foot .fp-backup-note{background:rgba(255,255,255,.1);border-radius:8px;padding:8px}
#fp-app .fp-side-foot .fp-backup-note.fp-warn{background:var(--yellow);color:var(--navy)}
#fp-app .fp-side-foot button.fp-link{background:none;border:0;color:#fff;text-decoration:underline;padding:0;min-height:44px;text-align:left;cursor:pointer;font-weight:700}

/* main */
#fp-app .fp-main{flex:1;min-width:0;padding:24px 28px}
#fp-app .fp-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
#fp-app .fp-head p{width:100%;color:#4a5a6a}
#fp-app .fp-draft{background:var(--yellow);color:var(--navy);font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px;white-space:nowrap}
#fp-app .fp-ph{color:#6a7a8a;font-style:italic}
#fp-app .fp-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
#fp-app .fp-grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#fp-app .fp-strand h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#fp-app .fp-strand ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#fp-app .fp-check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
#fp-app .fp-check input{width:24px;height:24px;flex:0 0 24px;accent-color:var(--blue);margin:0}
#fp-app .fp-btn{min-height:44px;border-radius:10px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
#fp-app .fp-btn.fp-primary{background:var(--blue);color:#fff}
#fp-app .fp-btn.fp-yellow{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
#fp-app .fp-btn.fp-danger{border-color:#a33;color:#a33}
#fp-app .fp-btn:disabled{opacity:.5;cursor:not-allowed}
#fp-app .fp-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#fp-app .fp-stack{display:flex;flex-direction:column;gap:14px}
#fp-app .fp-dots{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
#fp-app .fp-dots li{width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--blue);background:#fff}
#fp-app .fp-dots li.fp-done{background:var(--blue);color:#fff}
#fp-app .fp-dots li.fp-now{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
#fp-app .fp-banner{background:var(--t-amber);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
#fp-app .fp-banner.fp-ok{background:var(--t-green)}

/* all 12 weeks */
#fp-app .fp-weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0}
#fp-app .fp-week{border-radius:12px;padding:12px;min-height:96px;border:2px solid var(--line);background:#fff}
#fp-app .fp-week b{display:block;font-size:18px}
#fp-app .fp-week .fp-state{font-size:13px;font-weight:800}
#fp-app .fp-week.fp-done{background:var(--t-green);border-color:var(--t-green)}
#fp-app .fp-week.fp-now{border-color:var(--yellow);background:#fff8e1}
#fp-app .fp-week.fp-soon{opacity:.7}

/* reader mode */
#fp-app .fp-reader{font-size:26px;line-height:1.3}
#fp-app .fp-reader ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
#fp-app .fp-step{display:flex;align-items:center;gap:16px;background:#fff;border-radius:14px;padding:14px 18px;border:2px solid var(--line)}
#fp-app .fp-step.fp-done{background:var(--t-green);border-color:var(--t-green)}
#fp-app .fp-step .fp-num{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
#fp-app .fp-step .fp-icon{font-size:36px}
#fp-app .fp-step .fp-txt{flex:1}
#fp-app .fp-step .fp-check{font-size:20px;font-weight:800}
#fp-app .fp-step .fp-check input{width:32px;height:32px;flex-basis:32px}
#fp-app .fp-stars{font-size:40px;letter-spacing:4px}

/* toddler mode */
#fp-app .fp-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
#fp-app .fp-tile{aspect-ratio:1/1;border-radius:22px;border:4px solid transparent;font-size:72px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
#fp-app .fp-tile[aria-pressed="true"]{border-color:var(--navy)}
#fp-app .fp-tile[aria-pressed="true"]::after{content:"\2714";position:absolute;right:12px;top:8px;font-size:40px;color:var(--navy)}
#fp-app .fp-cue{background:var(--t-amber);border-radius:12px;padding:12px 16px;margin-bottom:16px}

/* print screen */
#fp-app .fp-printwrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
#fp-app fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px;background:#fff}
#fp-app legend{font-weight:800;padding:0 4px}
:is(#fp-app,#fp-printout) .fp-paper{background:#fff;color:#000;width:100%;max-width:8.5in;aspect-ratio:8.5/11;padding:.5in;box-shadow:0 2px 10px rgba(0,0,0,.15);font-family:Arial,Helvetica,sans-serif;font-size:13px;overflow:hidden}
:is(#fp-app,#fp-printout) .fp-paper.fp-lg{font-size:18px}
:is(#fp-app,#fp-printout) .fp-paper h2{font-size:1.6em;margin-bottom:.4em;font-family:Arial,Helvetica,sans-serif}
:is(#fp-app,#fp-printout) .fp-paper h3{font-size:1.15em;margin:.8em 0 .3em;font-family:Arial,Helvetica,sans-serif}
:is(#fp-app,#fp-printout) .fp-paper .fp-nameline{display:flex;gap:2em;margin-bottom:1em}
:is(#fp-app,#fp-printout) .fp-paper .fp-nameline span{flex:1;border-bottom:1px solid #000;padding-bottom:2px}
:is(#fp-app,#fp-printout) .fp-paper table{border-collapse:collapse;width:100%}
:is(#fp-app,#fp-printout) .fp-paper td,:is(#fp-app,#fp-printout) .fp-paper th{border:1px solid #000;padding:.35em;text-align:left;vertical-align:top}
:is(#fp-app,#fp-printout) .fp-paper .fp-box{display:inline-block;width:1em;height:1em;border:1px solid #000;vertical-align:middle;margin-right:.4em}
:is(#fp-app,#fp-printout) .fp-paper .fp-pagebreak{border-top:1px dashed #000;margin:1.2em 0 .6em;padding-top:.4em;font-weight:bold}
:is(#fp-app,#fp-printout) .fp-paper .fp-foot{margin-top:1.5em;font-size:.8em}

/* pieces */
#fp-app .fp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
#fp-app .fp-chips button{min-height:44px;border-radius:999px;border:2px solid var(--blue);background:#fff;color:var(--blue);padding:0 16px;font-weight:700;cursor:pointer}
#fp-app .fp-chips button[aria-pressed="true"]{background:var(--blue);color:#fff}
#fp-app .fp-piece{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
#fp-app .fp-weekchip{background:var(--t-blue);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}

/* family */
#fp-app .fp-kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
#fp-app .fp-bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
#fp-app .fp-bar i{display:block;height:100%;background:var(--blue)}
#fp-app .fp-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
#fp-app .fp-form label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:4px}
#fp-app .fp-form input,#fp-app .fp-form select{min-height:44px;border:1px solid #9fb3c4;border-radius:8px;padding:0 10px;background:#fff}

/* drill sheet maker (app/drills.html) inside the Print screen: restyle its controls only */
#fp-app #fp-drillhost{overflow-x:auto;margin-top:14px}
#fp-app #pd-drills .pd-controls{background:#fff;border:1px solid var(--line);border-radius:12px;max-width:none;font-family:Nunito,system-ui,Arial,sans-serif;color:var(--text)}
#fp-app #pd-drills .pd-controls input[type=text],#fp-app #pd-drills .pd-controls input[type=number],#fp-app #pd-drills .pd-controls select{min-height:44px;border-radius:8px;border-color:#9fb3c4}
#fp-app #pd-drills .pd-controls label.pd-check{min-height:44px}
#fp-app #pd-drills .pd-controls input[type=checkbox]{width:24px;height:24px;accent-color:var(--blue)}
#fp-app #pd-drills .pd-controls button{min-height:44px;border-radius:10px;border:2px solid var(--blue);color:var(--blue);font-weight:800;font-family:inherit;background:#fff}
#fp-app #pd-drills .pd-controls button.pd-primary{background:var(--blue);color:#fff}

/* help */
#fp-app details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 14px}
#fp-app summary{min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer}
#fp-app details p{padding-bottom:12px}

/* phone / small tablet */
@media (max-width:760px){
  #fp-app{flex-direction:column}
  #fp-app > #fp-side{flex-basis:auto}
  #fp-app .fp-side{width:100%;flex-basis:auto}
  #fp-app .fp-nav{flex-direction:row;flex-wrap:wrap}
  #fp-app .fp-nav li{flex:1 1 40%}
  #fp-app .fp-main{padding:16px}
  #fp-app .fp-grid4,#fp-app .fp-printwrap{grid-template-columns:1fr}
  #fp-app .fp-weeks{grid-template-columns:repeat(2,minmax(0,1fr))}
  #fp-app .fp-reader{font-size:22px}
}

/* print: the app copies the chosen sheet into #fp-printout (a direct child of <body>) and hides everything else */
#fp-printout{display:none}
@media print{
  @page{size:letter;margin:.5in}
  html.fp-printing body > *:not(#fp-printout){display:none !important}
  html.fp-printing,html.fp-printing body{margin:0 !important;padding:0 !important;background:#fff !important}
  html.fp-printing #fp-printout{display:block !important}
  #fp-printout .fp-paper,#fp-printout .fp-paper *{color:#000 !important;background:#fff !important}
  #fp-printout .fp-paper{width:100%;max-width:none;aspect-ratio:auto;padding:0;box-shadow:none;overflow:visible}
  #fp-printout .fp-paper .fp-pagebreak{break-before:page;page-break-before:always;border-top:0}
}
</style>

<div id="fp-app"><div id="fp-side"></div><main class="fp-main"><div id="fp-view"></div><div id="fp-drillhost" hidden>
<div id="pd-drills">
<style>
  #pd-drills { --ink: #000; --paper: #fff; --line: #000; --soft: #555;
    font-family: Helvetica, Arial, sans-serif; color: var(--ink); background: transparent; }
  #pd-drills * { box-sizing: border-box; }
  #pd-drills .pd-controls { max-width: 8.5in; margin: 0 auto 16px; padding: 14px; border: 1px solid #999;
    border-radius: 6px; background: #fafafa; color: #000; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  #pd-drills .pd-controls label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; }
  #pd-drills .pd-controls label.pd-check { flex-direction: row; align-items: center; gap: 8px; }
  #pd-drills .pd-controls input[type=text], #pd-drills .pd-controls input[type=number],
  #pd-drills .pd-controls select { font-size: 15px; padding: 6px; border: 1px solid #888; border-radius: 4px;
    background: #fff; color: #000; width: 100%; }
  #pd-drills .pd-seedrow { display: flex; gap: 6px; }
  #pd-drills .pd-buttons { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; grid-column: 1 / -1; }
  #pd-drills button { font-size: 15px; padding: 8px 14px; border: 1px solid #000; border-radius: 4px;
    background: #fff; color: #000; cursor: pointer; }
  #pd-drills button.pd-primary { background: #000; color: #fff; }
  #pd-drills .pd-msg { max-width: 8.5in; margin: 0 auto 12px; font-size: 14px; color: #000; }
  #pd-drills .pd-msg:empty { display: none; }
  #pd-drills .pd-msg.pd-error { border: 2px solid #000; padding: 8px; font-weight: bold; }

  /* One printed sheet = US Letter. On screen it is drawn as a paper page. */
  #pd-drills .pd-page { width: 8.5in; height: 11in; padding: 0.5in; margin: 0 auto 24px; background: var(--paper);
    box-shadow: 0 1px 6px rgba(0,0,0,.35); display: flex; flex-direction: column; overflow: hidden; color: #000; }
  #pd-drills .pd-head { border-bottom: 3px solid var(--line); padding-bottom: 6px; margin-bottom: 8px; }
  #pd-drills.pd-ink .pd-head { border-bottom-width: 1px; }
  #pd-drills .pd-nameline { display: flex; justify-content: space-between; font-size: 14px; }
  #pd-drills .pd-title { font-size: 22px; font-weight: bold; margin: 6px 0 2px; }
  #pd-drills .pd-instr { font-size: 14px; }
  #pd-drills .pd-keybanner { display: inline-block; border: 2px solid #000; padding: 1px 8px; font-weight: bold;
    font-size: 14px; margin-bottom: 4px; }
  #pd-drills .pd-grid { flex: 1; display: grid; gap: 6px; min-height: 0; }
  #pd-drills .pd-cell { position: relative; min-height: 0; min-width: 0; display: flex; }
  #pd-drills .pd-cell > svg { width: 100%; height: 100%; display: block; }
  #pd-drills .pd-num { position: absolute; left: 0; top: 0; font-size: 13px; font-weight: bold; }
  #pd-drills .pd-foot { display: flex; justify-content: space-between; font-size: 10px; border-top: 1px solid #000;
    padding-top: 4px; margin-top: 6px; gap: 12px; }
  #pd-drills.pd-large .pd-nameline, #pd-drills.pd-large .pd-instr { font-size: 19px; }
  #pd-drills.pd-large .pd-title { font-size: 30px; }
  #pd-drills.pd-large .pd-num { font-size: 18px; }
  #pd-drills.pd-large .pd-foot { font-size: 12px; }

  @page { size: letter; margin: 0.5in; }
  @media print {
    html.pd-printing body > *:not(#pd-drills) { display: none !important; }
    html.pd-printing, html.pd-printing body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
    #pd-drills .pd-controls, #pd-drills .pd-msg, #pd-drills .pd-noprint { display: none !important; }
    #pd-drills .pd-page { width: 7.5in; height: 9.95in; padding: 0; margin: 0; box-shadow: none;
      break-after: page; page-break-after: always; }
    #pd-drills .pd-page:last-child { break-after: auto; page-break-after: auto; }
  }
</style>

<div class="pd-controls">
  <label>Child's name <input type="text" id="pd-name" maxlength="40" placeholder="(optional)"></label>
  <label>Level <select id="pd-level"></select></label>
  <label>Drill type <select id="pd-type"></select></label>
  <label>Option <select id="pd-variant"></select></label>
  <label>Number of items <input type="number" id="pd-count" min="4" max="24" value="12"></label>
  <label>Seed (same seed = same sheet)
    <span class="pd-seedrow"><input type="number" id="pd-seed" min="1" max="4294967295"><button type="button" id="pd-newseed" title="Pick a new random seed">New</button></span>

  <label class="pd-check"><input type="checkbox" id="pd-large"> Large print</label>
  <label class="pd-check"><input type="checkbox" id="pd-ink"> Ink-saving black &amp; white</label>
  <label class="pd-check"><input type="checkbox" id="pd-key" checked> Include answer key</label>
  <div class="pd-buttons">
    <button type="button" class="pd-primary" id="pd-make">Make sheet</button>
    <button type="button" id="pd-print">Print</button>
  </div>
</div>
<div class="pd-msg" id="pd-msg"></div>
<div class="pd-sheets" id="pd-sheets"></div>
</div>

    var svg = el('svg', { viewBox: '0 0 ' + w + ' ' + h, preserveAspectRatio: 'xMidYMid meet' }, cell);
    return svg;
  }
  function vfSurface(cell, w, h) {
    var VF = Vex.Flow;
    var holder = document.createElement('div');
    var r = new VF.Renderer(holder, VF.Renderer.Backends.SVG);
    r.resize(w, h);
    var ctx = r.getContext();
    var svg = holder.querySelector('svg');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.removeAttribute('width'); svg.removeAttribute('height');
    svg.style.width = '100%'; svg.style.height = '100%';
    cell.appendChild(svg);
    return { ctx: ctx, svg: svg };
  }
  function answerLine(svg, x1, x2, y, answer, size) {
    if (answer == null) el('line', { x1: x1, x2: x2, y1: y, y2: y, stroke: '#000', 'stroke-width': 1.2 }, svg);
    else txt(svg, (x1 + x2) / 2, y - 3, answer, size || 20, { bold: true });
  }
  function noteWithAcc(VF, p, clef, dur) {
    var n = new VF.StaveNote({ clef: clef, keys: [vfKey(p)], duration: dur || 'w' });
    if (p.acc) n.addModifier(new VF.Accidental(p.acc === 1 ? '#' : 'b'), 0);
    return n;
  }
  function drawStaves(VF, ctx, clef, x, y, w, keySig) {
    if (clef !== 'grand') {
      var s = new VF.Stave(x, y, w).addClef(clef);
      if (keySig) s.addKeySignature(keySig);
      s.setContext(ctx).draw();
      return { treble: s, bass: s, top: s, bottom: s };
    }
    var t = new VF.Stave(x, y, w).addClef('treble');
    var b = new VF.Stave(x, y + 80, w).addClef('bass');
    if (keySig) { t.addKeySignature(keySig); b.addKeySignature(keySig); }
    t.setContext(ctx).draw(); b.setContext(ctx).draw();
    new VF.StaveConnector(t, b).setType(VF.StaveConnector.type.BRACE).setContext(ctx).draw();
    new VF.StaveConnector(t, b).setType(VF.StaveConnector.type.SINGLE_LEFT).setContext(ctx).draw();
    return { treble: t, bass: b, top: t, bottom: b };
  }

  function drawNoteNaming(cell, it, key) {
    var VF = Vex.Flow, grand = it.clef === 'grand';
    var W = 170, H = grand ? 250 : 165;
    var s = vfSurface(cell, W, H);
    var st = drawStaves(VF, s.ctx, it.clef, 22, 10, 140);
    var stave = st[it.staff];
    var n = noteWithAcc(VF, it.p, it.staff);
    VF.Formatter.FormatAndDraw(s.ctx, stave, [n]);
    var x = n.getAbsoluteX() + 6;
    answerLine(s.svg, x - 30, x + 30, H - 12, key ? it.answer : null);
  }

  function drawInterval(cell, it, key) {
    var VF = Vex.Flow, W = 210, H = 165;
    var s = vfSurface(cell, W, H);
    var stave = drawStaves(VF, s.ctx, it.clef, 22, 10, 180).top;
    var notes;
    if (it.pres === 'harmonic') {
      var c = new VF.StaveNote({ clef: it.clef, keys: [vfKey(it.lo), vfKey(it.hi)], duration: 'w' });
      [it.lo, it.hi].forEach(function (p, i) { if (p.acc) c.addModifier(new VF.Accidental(p.acc === 1 ? '#' : 'b'), i); });
      notes = [c];
    } else {
      var a = noteWithAcc(VF, it.dir === 'down' ? it.hi : it.lo, it.clef);
      var b = noteWithAcc(VF, it.dir === 'down' ? it.lo : it.hi, it.clef);
      notes = [a, b];
    }
    VF.Formatter.FormatAndDraw(s.ctx, stave, notes);
    answerLine(s.svg, 70, 150, H - 12, key ? it.answer : null);
    if (key) txt(s.svg, 110, H - 0.5, it.answerLong, 10);
  }

  function drawKeySig(cell, it, key) {
    var VF = Vex.Flow, grand = it.clef === 'grand';
    var W = 170, H = grand ? 250 : 165;
    var s = vfSurface(cell, W, H);
    drawStaves(VF, s.ctx, it.clef, 22, 10, 140, it.key);
    if (!it.minor) {
      answerLine(s.svg, 40, 110, H - 12, key ? it.answer : null);
      if (!key) txt(s.svg, 135, H - 14, TEXT.major, 14);
    } else {
      answerLine(s.svg, 30, 95, H - 30, key ? it.answer : null, 16);
      answerLine(s.svg, 30, 95, H - 6, key ? it.answer2 : null, 16);
      if (!key) { txt(s.svg, 125, H - 32, TEXT.major, 13); txt(s.svg, 125, H - 8, TEXT.minor, 13); }
    }
  }

  function drawRhythm(cell, it, key) {
    if (it.sticks) return drawSticks(cell, it, key);
    var VF = Vex.Flow, W = 720, H = 120;
    var s = vfSurface(cell, W, H), ctx = s.ctx;
    var tp = it.time.split('/');
    var staves = [], allNotes = [], x = 25;
    var widths = [370, 320];
    it.measures.forEach(function (groups, mi) {
      var st = new VF.Stave(x, 0, widths[mi]);
      if (mi === 0) st.addTimeSignature(it.time);
      if (mi === it.measures.length - 1) st.setEndBarType(VF.Barline.type.END);
      st.setConfigForLines([{ visible: false }, { visible: false }, { visible: true }, { visible: false }, { visible: false }]);
      st.setContext(ctx).draw();
      x += widths[mi];
      var notes = [], beams = [];
      groups.forEach(function (g) {
        var gn = g.events.map(function (e) {
          var d = e.dur.replace('d', '');
          var keys = ['b/4'];
          var n = new VF.StaveNote({ keys: keys, duration: d, stem_direction: 1 });
          if (e.dur.indexOf('d') > 0 && e.dur !== 'd') VF.Dot.buildAndAttach([n], { all: true });
          n.__count = e.count;
          return n;
        });
        var beamable = gn.filter(function (n, i) { return !g.events[i].rest && /^(8|16)$/.test(g.events[i].dur); });
        if (g.beam && beamable.length > 1) beams.push(new VF.Beam(beamable));
        notes = notes.concat(gn);
      });
      var voice = new VF.Voice({ num_beats: parseInt(tp[0], 10), beat_value: parseInt(tp[1], 10) });
      voice.setMode(VF.Voice.Mode.SOFT);
      voice.addTickables(notes);
      new VF.Formatter().joinVoices([voice]).format([voice], st.getNoteEndX() - st.getNoteStartX() - 15);
      voice.draw(ctx, st);
      beams.forEach(function (b) { b.setContext(ctx).draw(); });
      staves.push(st);
      allNotes.push(notes);
    });
    if (it.tie) {
      var a = allNotes[0][allNotes[0].length - 1], b = allNotes[1][0];
      new VF.StaveTie({ first_note: a, last_note: b, first_indices: [0], last_indices: [0] }).setContext(ctx).draw();
    }
    var y = H - 22;
    allNotes.forEach(function (ns) {
      ns.forEach(function (n) {
        var cx = n.getAbsoluteX() + 6;
        if (key) txt(s.svg, cx, y, n.__count, n.__count.length > 5 ? 11 : 14, { bold: true });
        else el('line', { x1: cx - 9, x2: cx + 9, y1: y + 4, y2: y + 4, stroke: '#000', 'stroke-width': 1 }, s.svg);
      });
    });
  }

  /* Pre-reader stick notation: ta = one stick, ti-ti = two joined sticks, rest = Z-shaped mark. */
  function drawSticks(cell, it, key) {
    var W = 720, H = 120, svg = blankSvg(cell, W, H);
    var x = 40, unit = it.time === '2/4' ? 150 : 75;
    it.measures.forEach(function (groups, mi) {
      groups.forEach(function (g) {
        if (g.name === 'Q') {
          el('line', { x1: x, x2: x, y1: 25, y2: 75, stroke: '#000', 'stroke-width': 4 }, svg);
          if (key) txt(svg, x, 105, g.events[0].count, 16, { bold: true });
        } else if (g.name === 'E2') {
          el('path', { d: 'M' + (x - 12) + ' 75 V25 H' + (x + 12) + ' V75', stroke: '#000', 'stroke-width': 4, fill: 'none' }, svg);
          if (key) txt(svg, x, 105, 'ti ti', 16, { bold: true });
        } else {
          el('path', { d: 'M' + (x - 8) + ' 32 L' + (x + 8) + ' 40 L' + (x - 8) + ' 58 L' + (x + 8) + ' 66', stroke: '#000', 'stroke-width': 4, fill: 'none' }, svg);
          if (key) txt(svg, x, 105, g.events[0].count, 14, { bold: true });
        }
        x += unit;
      });
      var bx = x - unit / 2 + 8;
      el('line', { x1: bx, x2: bx, y1: 15, y2: 85, stroke: '#000', 'stroke-width': mi === it.measures.length - 1 ? 5 : 1.5 }, svg);
      x += 16;
    });
    txt(svg, 12, 58, it.time.split('/')[0], 22, { bold: true });
  }

  function drawKeyboard(cell, it, key, ink) {
    var ww = 26, wh = 110, bw = 16, bh = 68;
    var whites = it.octaves * 7 + 1;
    var W = whites * ww + 20, H = 175, x0 = 10, y0 = 30;
    var svg = blankSvg(cell, W, H);
    var instr = it.task === 'mark-note' ? TEXT.kb['mark-note'].replace('{note}', LETTERS[it.letter]) : TEXT.kb[it.task];
    txt(svg, x0, 18, instr, 15, { anchor: 'start' });
    var pid = 'pd-hatch-' + (++hatchCount);
    if (ink) {
      var pat = el('pattern', { id: pid, width: 5, height: 5, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, el('defs', {}, svg));
      el('line', { x1: 0, y1: 0, x2: 0, y2: 5, stroke: '#000', 'stroke-width': 1.5 }, pat);
    }
    function wx(i) { return x0 + i * ww; }
    function bx(i) { return x0 + (i + 1) * ww - bw / 2; }

    for (var j = 0; j < whites - 1; j++) if (BLACK_AFTER.indexOf(j % 7) >= 0)
      el('rect', { x: bx(j), y: y0, width: bw, height: bh, fill: ink ? 'url(#' + pid + ')' : '#000', stroke: '#000', 'stroke-width': 1.2 }, svg);
    function center(m) { return m.white != null ? { x: wx(m.white) + ww / 2, y: y0 + wh - 18, black: false } : { x: bx(m.black) + bw / 2, y: y0 + bh - 14, black: true }; }
    (it.marks || []).forEach(function (m, idx) {
      var c = center(m);
      el('circle', { cx: c.x, cy: c.y, r: 7, fill: c.black ? '#fff' : '#000', stroke: '#000', 'stroke-width': 2 }, svg);
      if (key && it.answerMark === idx) el('circle', { cx: c.x, cy: c.y, r: 13, fill: 'none', stroke: '#000', 'stroke-width': 3 }, svg);
    });
    if (key && (it.task === 'groups2' || it.task === 'groups3')) {
      for (var o = 0; o < it.octaves; o++) {
        var first = it.task === 'groups2' ? 0 : 3, n = it.task === 'groups2' ? 2 : 3;
        var left = bx(o * 7 + first) - 6, right = bx(o * 7 + first + n - 1) + bw + 6;
        el('ellipse', { cx: (left + right) / 2, cy: y0 + bh / 2, rx: (right - left) / 2, ry: bh / 2 + 6, fill: 'none', stroke: '#000', 'stroke-width': 3 }, svg);
      }
    }
    if (key && it.task === 'mark-note') it.answerWhites.forEach(function (w) {
      var cx = wx(w) + ww / 2, cy = y0 + wh - 18;
      el('path', { d: 'M' + (cx - 7) + ' ' + (cy - 7) + ' L' + (cx + 7) + ' ' + (cy + 7) + ' M' + (cx + 7) + ' ' + (cy - 7) + ' L' + (cx - 7) + ' ' + (cy + 7), stroke: '#000', 'stroke-width': 3 }, svg);
    });
    if (it.answer != null) {
      answerLine(svg, x0 + 10, x0 + 110, H - 8, key ? it.answer : null, 18);
    }
  }

  function shape(svg, kind, cx, cy, r, ink) {
    var fill = ink ? '#fff' : '#000', sw = 3;
    if (kind === 'circle') return el('circle', { cx: cx, cy: cy, r: r, fill: fill, stroke: '#000', 'stroke-width': sw }, svg);
    if (kind === 'square') return el('rect', { x: cx - r, y: cy - r, width: 2 * r, height: 2 * r, fill: fill, stroke: '#000', 'stroke-width': sw }, svg);
    if (kind === 'triangle') return el('path', { d: 'M' + cx + ' ' + (cy - r) + ' L' + (cx + r) + ' ' + (cy + r) + ' L' + (cx - r) + ' ' + (cy + r) + ' Z', fill: fill, stroke: '#000', 'stroke-width': sw }, svg);
    if (kind === 'heart') return el('path', { d: 'M' + cx + ' ' + (cy + r) + ' C' + (cx - 2 * r) + ' ' + (cy - r / 3) + ' ' + (cx - r) + ' ' + (cy - 1.6 * r) + ' ' + cx + ' ' + (cy - r / 2) +
      ' C' + (cx + r) + ' ' + (cy - 1.6 * r) + ' ' + (cx + 2 * r) + ' ' + (cy - r / 3) + ' ' + cx + ' ' + (cy + r) + ' Z', fill: fill, stroke: '#000', 'stroke-width': sw }, svg);
    var pts = [];
    for (var i = 0; i < 10; i++) { var a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * 0.45 : r * 1.1; pts.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1)); }

  }
  function ring(svg, cx, cy, rx, ry) { el('ellipse', { cx: cx, cy: cy, rx: rx, ry: ry, fill: 'none', stroke: '#000', 'stroke-width': 3, 'stroke-dasharray': '8 5' }, svg); }

  function drawPrereader(cell, it, key, ink) {
    var W = 320, H = 210, svg = blankSvg(cell, W, H);
    el('rect', { x: 2, y: 2, width: W - 4, height: H - 4, fill: 'none', stroke: '#000', 'stroke-width': ink ? 1 : 2, rx: 12 }, svg);
    if (it.kind === 'highlow') {
      txt(svg, W / 2, 30, TEXT.pre[it.ask], 18, { bold: true });
      var hx = it.highLeft ? 95 : 225, lx = it.highLeft ? 225 : 95;
      shape(svg, it.shape, hx, 70, 22, ink); shape(svg, it.shape, lx, 165, 22, ink);

    } else if (it.kind === 'longshort') {
      txt(svg, W / 2, 30, TEXT.pre[it.ask], 18, { bold: true });

      shape(svg, it.shape, 40, ys[1], 14, ink); el('rect', { x: 60, y: ys[1] - 7, width: 55, height: 14, fill: ink ? '#fff' : '#000', stroke: '#000', 'stroke-width': 3 }, svg);
      if (key) { var ry = it.ask === 'long' ? ys[0] : ys[1], right = it.ask === 'long' ? 300 : 125; ring(svg, (18 + right) / 2, ry, (right - 18) / 2, 24); }
    } else {
      txt(svg, W / 2, 28, TEXT.pre.stepskip, 18, { bold: true });
      var stairs = 4, sw = 50, sh = 24, sx = 60, sy = 150;
      var d = 'M' + sx + ' ' + sy;
      for (var i = 0; i < stairs; i++) d += ' H' + (sx + (i + 1) * sw) + ' V' + (sy - (i + 1) * sh);
      el('path', { d: d, fill: 'none', stroke: '#000', 'stroke-width': 2 }, svg);
      var a = it.start, b2 = it.start + (it.skip ? 2 : 1);
      if (!it.up) { var t = a; a = stairs - 1 - t; b2 = stairs - 1 - (t + (it.skip ? 2 : 1)); }
      [a, b2].forEach(function (s) { shape(svg, it.shape, sx + s * sw + sw / 2, sy - s * sh - 14, 11, ink); });
      txt(svg, 90, 192, 'STEP', 18, { bold: true }); txt(svg, 230, 192, 'SKIP', 18, { bold: true });
      if (key) ring(svg, it.skip ? 230 : 90, 186, 42, 18);
    }
  }

  /* ============================================================
     7. PAGES, CONTROLS, PRINT
     ============================================================ */
  var $ = function (id) { return document.getElementById(id); };
  var ROOT = $('pd-drills');

  function available(level) {
    return DRILLS.filter(function (d) { return LIMITS[d.id][level]; });
  }
  function variantsFor(drill, level) {
    var lim = LIMITS[drill][level];
    if (drill === 'note-naming' || drill === 'intervals' || drill === 'key-signatures') return lim.clefs;
    if (drill === 'rhythm') return lim.syllables;
    if (drill === 'keyboard') return ['mixed'].concat(lim.tasks);
    if (drill === 'prereader') return ['mixed'].concat(lim.kinds);
    return ['mixed'];
  }
  function fill(select, list, names, keep) {
    select.innerHTML = '';
    list.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v.id || v; o.textContent = v.name || names[v] || v;
      select.appendChild(o);
    });
    if (keep && list.some(function (v) { return (v.id || v) === keep; })) select.value = keep;
  }
  function refreshMenus() {
    var level = $('pd-level').value;
    fill($('pd-type'), available(level), {}, $('pd-type').value);
    fill($('pd-variant'), variantsFor($('pd-type').value, level), VARIANT_NAMES, $('pd-variant').value);
  }
  function newSeed() { $('pd-seed').value = 1 + Math.floor(Math.random() * 999999); }

  function settings() {
    var count = Math.max(4, Math.min(24, parseInt($('pd-count').value, 10) || 12));
    $('pd-count').value = count;
    var seed = parseInt($('pd-seed').value, 10);
    if (!(seed >= 1 && seed <= 4294967295)) { newSeed(); seed = parseInt($('pd-seed').value, 10); }
    return { name: $('pd-name').value.trim(), level: $('pd-level').value, drill: $('pd-type').value,
             variant: $('pd-variant').value, count: count, seed: seed,
             large: $('pd-large').checked, ink: $('pd-ink').checked, key: $('pd-key').checked };
  }

  function generate(st) {
    var rng = makeRng(st.seed);
    switch (st.drill) {
      case 'note-naming': return genNoteNaming(rng, st.level, st.variant, st.count);
      case 'intervals': return genIntervals(rng, st.level, st.variant, st.count);
      case 'key-signatures': return genKeySigs(rng, st.level, st.variant, st.count);
      case 'rhythm': return genRhythm(rng, st.level, st.variant, st.count);
      case 'keyboard': return genKeyboard(rng, st.level, st.variant, st.count);
      case 'prereader': return genPrereader(rng, st.level, st.variant, st.count);
    }
    return [];
  }
  var DRAW = { 'note-naming': drawNoteNaming, 'intervals': drawInterval, 'key-signatures': drawKeySig,
               'rhythm': drawRhythm, 'keyboard': drawKeyboard, 'prereader': drawPrereader };

  function sheetCode(st) {
    var lvl = LEVELS.filter(function (l) { return l.id === st.level; })[0].name;
    var drill = DRILLS.filter(function (d) { return d.id === st.drill; })[0].name.split(':')[0];
    return 'Seed ' + st.seed + ' · ' + lvl + ' · ' + drill + ' (' + (VARIANT_NAMES[st.variant] || st.variant) + ') · ' + st.count + ' items';
  }
  function instruction(st) {
    if (st.drill === 'rhythm') {
      if (LIMITS.rhythm[st.level].sticks) return TEXT.instr['rhythm-sticks'];
      return st.variant === 'kodaly' ? TEXT.instr['rhythm-kodaly'] : TEXT.instr.rhythm;
    }
    return TEXT.instr[st.drill];
  }

  function makePage(st, pageNo, pageCount, isKey, cols, rows) {
    var page = document.createElement('section');
    page.className = 'pd-page';
    var head = document.createElement('div'); head.className = 'pd-head';
    var name = st.name ? st.name : '_______________________';
    head.innerHTML = (isKey ? '<div class="pd-keybanner"></div>' : '') +
      '<div class="pd-nameline"><span></span><span>' + TEXT.dateLabel + ' ____________</span></div>' +
      '<div class="pd-title"></div><div class="pd-instr"></div>';
    if (isKey) head.querySelector('.pd-keybanner').textContent = TEXT.keyTitle;
    head.querySelector('.pd-nameline span').textContent = TEXT.nameLabel + ' ' + name;
    head.querySelector('.pd-title').textContent = TEXT.titles[st.drill];
    head.querySelector('.pd-instr').textContent = instruction(st);
    var grid = document.createElement('div'); grid.className = 'pd-grid';
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
    var foot = document.createElement('div'); foot.className = 'pd-foot';
    var left = document.createElement('span'); left.textContent = sheetCode(st) + (isKey ? ' · answer key' : '');
    var right = document.createElement('span');
    right.textContent = (RULES_STATUS === 'approved' ? '' : TEXT.draft + ' · ') + 'Page ' + pageNo + ' of ' + pageCount;
    foot.appendChild(left); foot.appendChild(right);
    page.appendChild(head); page.appendChild(grid); page.appendChild(foot);
    return { page: page, grid: grid };
  }

  function render() {
    var msg = $('pd-msg');
    msg.className = 'pd-msg'; msg.textContent = '';
    if (!window.Vex || !Vex.Flow) {
      msg.className = 'pd-msg pd-error';
      msg.textContent = 'The music drawing library (VexFlow) did not load. Check the internet connection and reload the page.';
      return;
    }
    var st = settings();
    ROOT.classList.toggle('pd-large', st.large);
    ROOT.classList.toggle('pd-ink', st.ink);
    var items = generate(st);
    if (items.length < st.count) msg.textContent = 'Only ' + items.length + ' different items fit these level limits.';
    var lay = st.drill === 'keyboard' && LIMITS.keyboard[st.level].octaves.every(function (o) { return o === 1; }) ? LAYOUT['keyboard-1'] : LAYOUT[st.drill];
    var cr = st.large ? lay.large : lay.normal, per = cr[0] * cr[1];
    var pages = Math.ceil(items.length / per);
    var out = $('pd-sheets');
    out.innerHTML = '';
    var passes = st.key ? [false, true] : [false];
    passes.forEach(function (isKey) {
      for (var p = 0; p < pages; p++) {
        var pg = makePage(st, p + 1, pages, isKey, cr[0], cr[1]);
        out.appendChild(pg.page);
        items.slice(p * per, (p + 1) * per).forEach(function (it, i) {
          var cell = document.createElement('div'); cell.className = 'pd-cell';
          var num = document.createElement('span'); num.className = 'pd-num'; num.textContent = (p * per + i + 1) + '.';
          pg.grid.appendChild(cell);
          DRAW[st.drill](cell, it, isKey, st.ink);
          cell.appendChild(num);
        });
      }
    });
  }

  /* Printing: move the sheets to the top of the page and hide everything else
     (works inside a Squarespace page as well as on its own). */
  var placeholder = null;
  function beforePrint() {
    // Inside the Family Piano app the maker sits in a hidden panel until "Drill sheet" is picked.

    var it = (w.strand_items[s] || [])[0]; if (!it) return "";
    var done = !!c.done[it.id];
    return '<button type="button" class="fp-tile" style="background:' + tintFor(i) + '" data-act="tile" data-id="' + esc(it.id) + '" aria-pressed="' + done + '" aria-label="' +
      esc(TEXT.strands[s] + (done ? ", " + TEXT.done : "")) + '"><span aria-hidden="true">' + TEXT.icons[s] + "</span></button>";
  }).join("");
  return '<div class="fp-cue"><b>For the grown-up:</b> ' + txt(w.parent_notes, "Parent cue") + " " + draftChip(isDraft(w)) + "</div>" +
    '<h1 class="fp-sr" tabindex="-1" id="fp-h1">' + esc(TEXT.nav.toddler[0][1]) + '</h1><div class="fp-tiles">' + tiles + "</div>" +
    '<div class="fp-row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="fp-btn" data-act="grown">' + esc(TEXT.grownUp) + "</button></div>";
}

function screenWeeks(c){
  var p = CONTENT.paths[c.level];
  var cells = range12().map(function(n){
    var w = weekOf(c, n);
    var st = (c.complete || n < c.week) ? ["fp-done", TEXT.stateDone] : n === c.week ? ["fp-now", TEXT.stateNow] : ["fp-soon", TEXT.stateSoon];
    var inner = "<b>" + esc(TEXT.week) + " " + n + '</b><span class="fp-state">' + esc(st[1]) + "</span><p>" + txt(w && w.focus, "Week focus") + "</p>";
    var open = st[0] === "fp-now" ? '<button type="button" data-go="week" class="fp-btn" style="margin-top:6px">' + esc(TEXT.nav.standard[0][1]) + "</button>" :
      st[0] === "fp-done" ? '<button type="button" data-act="viewweek" data-n="' + n + '" class="fp-btn" style="margin-top:6px" aria-label="' + esc(TEXT.openWeek + " " + TEXT.week + " " + n) + '">' + esc(TEXT.openWeek) + "</button>" : "";
    return '<li class="fp-week ' + st[0] + '"' + (st[0] === "fp-now" ? ' aria-current="step"' : "") + ">" + inner + open + "</li>";
  }).join("");
  return head(TEXT.nav.standard[1][1], isDraft(p)) + '<ol class="fp-weeks">' + cells + "</ol>";
}

/* ----- print ----- */
function paperHtml(c){
  var o = ui.opts, lv = levelById(c.level), w = weekOf(c, c.week), body = "";
  var nameline = o.nameline ? '<div class="fp-nameline"><span>Name: ' + esc(c.name) + "</span><span>Date:</span></div>" : "";
  if (ui.sheet === "plan") {
    body = "<h2>" + esc(lv.name) + " – " + esc(TEXT.week) + " " + c.week + "</h2>" + nameline +
      "<p><b>Focus:</b> " + esc(plain(w.focus, "Week focus")) + "</p>" +
      lv.strands.map(function(s){ return "<h3>" + esc(TEXT.strands[s]) + "</h3>" + (w.strand_items[s] || []).map(function(it){
        return '<p><span class="fp-box"></span>' + esc(plain(it.topic, "Topic")) + "</p>"; }).join(""); }).join("");
    if (o.key) body += '<div class="fp-pagebreak">ANSWER KEY / PARENT NOTES (for the parent)</div><p>' + esc(plain(w.parent_notes, "Parent notes")) + "</p>";
  } else if (ui.sheet === "chart") {
    var pc = w.practice_chart || {}, days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    var rows = (pc.items && pc.items.length ? pc.items : [TEXT.ph("Practice item"), "", ""]);
    body = "<h2>" + esc(TEXT.practiceChart) + " – " + esc(TEXT.week) + " " + c.week + "</h2>" + nameline +
      "<p>Minutes per day: " + esc(pc.minutes_per_day || "____") + " · Days per week: " + esc(pc.days_per_week || "____") + "</p>" +
      "<table><thead><tr><th>Practice</th>" + days.map(function(d){ return "<th>" + d + "</th>"; }).join("") + "</tr></thead><tbody>" +
      rows.map(function(r){ return "<tr><td style=\"height:3em\">" + esc(typeof r === "string" ? r : (r.label || r.id || "")) + "</td>" + days.map(function(){ return "<td></td>"; }).join("") + "</tr>"; }).join("") +
      "</tbody></table>";
    if (o.key) body += '<div class="fp-pagebreak">PARENT NOTES (for the parent)</div><p>' + esc(plain(w.parent_notes, "Parent notes")) + "</p>";
  } else if (ui.sheet === "quiz" || ui.sheet === "checklist") {
    var pl = CONTENT.placement[ui.sheet];
    body = pl.main + (o.key && pl.key ? '<div class="fp-pagebreak">' + esc(TEXT.placementKey) + "</div>" + pl.key : "");
    return '<div class="fp-paper' + (o.large ? " fp-lg" : "") + '" aria-label="Paper preview">' + body + "</div>";
  } else {
    body = "<h2>" + esc(lv.name) + " – 12-week overview</h2>" + nameline + "<table><thead><tr><th>Week</th><th>Focus</th><th>Done</th></tr></thead><tbody>" +
      range12().map(function(n){ var ww = weekOf(c, n); return "<tr><td>" + n + "</td><td>" + esc(plain(ww && ww.focus, "Week focus")) + '</td><td><span class="fp-box"></span></td></tr>'; }).join("") +
      "</tbody></table>";
    if (o.key) body += '<div class="fp-pagebreak">LEVEL GOALS (for the parent)</div>' + lv.strands.map(function(s){
      return "<h3>" + esc(TEXT.strands[s]) + "</h3>" + (lv.goals[s] || []).map(function(g){ return "<p>" + esc(g.topic) + ": " + esc(plain(g.description, "Goal description")) + "</p>"; }).join(""); }).join("");
  }
  return '<div class="fp-paper' + (o.large ? " fp-lg" : "") + '" aria-label="Paper preview">' + body +
    '<p class="fp-foot">' + (isDraft(w) ? "DRAFT – needs educator review" : "") + "</p></div>";
}
function screenPrint(c){
  var radios = TEXT.sheets.map(function(s){
    return '<label class="fp-check"><input type="radio" name="fp-sheet" value="' + s[0] + '" data-act="sheet"' + (ui.sheet === s[0] ? " checked" : "") + "> " + esc(s[1]) + "</label>"; }).join("");
  var opts = Object.keys(TEXT.printOpts).map(function(k){
    return '<label class="fp-check"><input type="checkbox" data-act="opt" data-opt="' + k + '"' + (ui.opts[k] ? " checked" : "") + "> " + esc(TEXT.printOpts[k]) + "</label>"; }).join("");
  if (ui.sheet === "drill") return head(TEXT.nav.standard[2][1], true, "Prints in black and white on US Letter paper.") +
    "<fieldset><legend>Sheet</legend>" + radios + "</fieldset><p>" + esc(TEXT.drillHint) + "</p>";
  return head(TEXT.nav.standard[2][1], isDraft(weekOf(c, c.week)), "Prints in black and white on US Letter paper.") +
    '<div class="fp-printwrap"><div><fieldset><legend>Sheet</legend>' + radios + "</fieldset><fieldset><legend>Options</legend>" + opts + "</fieldset>" +
    '<div class="fp-row"><button type="button" class="fp-btn fp-primary" data-act="doprint">' + esc(TEXT.print) + "</button>" +
    '<button type="button" class="fp-btn" data-act="doprint" data-pdf="1">' + esc(TEXT.savePdf) + "</button></div>" +
    (ui.msg ? '<p role="status" style="margin-top:8px">' + esc(ui.msg) + "</p>" : "") + "</div>" + paperHtml(c) + "</div>";
}

/* ----- pieces ----- */
function pieceWeeks(level){
  var map = {}, p = CONTENT.paths[level];
  if (p) p.weeks.forEach(function(w){ (w.repertoire_ids || []).forEach(function(id){ map[id] = map[id] || w.week; }); });
  return map;
}
function screenPieces(c){
  var weeks = pieceWeeks(c.level);
  var chips = '<div class="fp-chips" role="group" aria-label="Filter">' + TEXT.filters.map(function(f){
    return '<button type="button" data-act="filter" data-f="' + f[0] + '" aria-pressed="' + (ui.filter === f[0]) + '">' + esc(f[1]) + "</button>"; }).join("") + "</div>";
  var list = CONTENT.assets.filter(function(a){
    if (ui.filter === "level") return a.asset_id in weeks;
    if (ui.filter === "learned") return !!c.learned[a.asset_id];
    if (ui.filter === "todo") return !c.learned[a.asset_id];
    return true;
  });
  var rows = list.length ? '<div class="fp-stack">' + list.map(function(a){
    var wk = weeks[a.asset_id];
    return '<div class="fp-card fp-piece"><label class="fp-check"><input type="checkbox" data-act="learned" data-id="' + esc(a.asset_id) + '"' + (c.learned[a.asset_id] ? " checked" : "") +
      '><span class="fp-sr">' + esc(TEXT.learned + ": " + a.title) + "</span></label>" +
      "<div><b>" + esc(a.title) + "</b> – " + esc(a.composer) + "<br><small>" + txt(a.attribution_text, "License credit") + "</small></div>" +
      '<div class="fp-row">' + (wk ? '<span class="fp-weekchip">' + esc(TEXT.week) + " " + wk + "</span>" : "") +
      (a.url ? '<a class="fp-btn" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(TEXT.openScore) + "</a>" : "") + "</div></div>";
  }).join("") + "</div>" : '<div class="fp-card"><p>' + esc(TEXT.piecesEmpty) + "</p></div>";
  var title = c.mode === "reader" ? TEXT.nav.reader[1][1] : TEXT.nav.standard[3][1];
  return head(title, true) + chips + rows;
}

/* ----- stars (reader) ----- */
function screenStars(c){
  var n = Object.keys(c.done).filter(function(k){ return c.done[k]; }).length;
  return head(TEXT.myStars, false) + '<div class="fp-card fp-reader"><p class="fp-stars" role="img" aria-label="' + n + ' stars">' +
    (n ? new Array(Math.min(n, 48) + 1).join("⭐") : "☆") + '</p><p>' + n + " ⭐</p></div>";
}

/* ----- family ----- */
function childForm(k){
  var opts = CONTENT.levels.levels.slice().sort(function(a,b){ return a.order - b.order; }).map(function(l){
    return '<option value="' + esc(l.id) + '"' + (k && k.level === l.id ? " selected" : "") + ">" + esc(l.name + " (ages " + l.age_guide.min + "–" + l.age_guide.max + ")") + "</option>"; }).join("");
  var modes = (k ? "" : '<option value="">Pick for me</option>') + Object.keys(TEXT.modes).map(function(m){
    return '<option value="' + m + '"' + (k && k.mode === m ? " selected" : "") + ">" + esc(TEXT.modes[m]) + "</option>"; }).join("");
  var title = k ? TEXT.edit + " " + k.name : TEXT.addChild;
  return '<form class="fp-card" data-form="child"' + (k ? ' data-id="' + esc(k.id) + '"' : "") + '><h2 style="margin-bottom:10px">' + esc(title) + '</h2><div class="fp-form">' +
    '<label>Name<input name="name" required maxlength="40" autocomplete="off" value="' + esc(k ? k.name : "") + '"></label>' +
    '<label>Age<input name="age" type="number" min="2" max="18" inputmode="numeric" value="' + esc(k && k.age ? k.age : "") + '"></label>' +
    '<label>Level<select name="level">' + opts + "</select></label>" +
    '<label>Mode<select name="mode">' + modes + "</select></label>" +
    '<label>' + (k ? "Current week" : "Start at week") + '<input name="week" type="number" min="1" max="12" value="' + (k ? k.week : 1) + '"></label></div>' +
    '<div class="fp-row" style="margin-top:12px"><button type="submit" class="fp-btn fp-primary">' + esc(k ? TEXT.saveChild : TEXT.addChild) + "</button>" +
    (S.children.length ? '<button type="button" class="fp-btn" data-act="cancel">Cancel</button>' : "") + "</div></form>";
}
function backupBanner(){
  var d = daysSince(S.lastBackup);
  var ok = d !== null && d <= 7;
  return '<div class="fp-banner' + (ok ? " fp-ok" : "") + '"><span>' + esc(d === null ? TEXT.backupNever : TEXT.backupDays(d)) + "</span>" +
    '<button type="button" class="fp-btn fp-primary" data-act="export">' + esc(TEXT.backupNow) + "</button></div>";
}
function screenFamily(){
  var cards = S.children.map(function(k){
    var lv = levelById(k.level), pct = Math.round(weeksDoneCount(k) / 12 * 100);
    return '<section class="fp-card"><h3>' + esc(k.name) + "</h3><p>" + (k.age ? "Age " + esc(k.age) + " · " : "") + esc(lv ? lv.name : k.level) + " · " + esc(TEXT.modes[k.mode]) + "</p>" +
      "<p>" + (k.complete ? esc(TEXT.allDone) : esc(TEXT.week) + " " + k.week + " " + esc(TEXT.of12)) + "</p>" +
      '<div class="fp-bar" role="img" aria-label="' + pct + '% done"><i style="width:' + pct + '%"></i></div>' +
      '<div class="fp-row"><button type="button" class="fp-btn" data-act="pick" data-id="' + esc(k.id) + '">Open</button>' +
      '<button type="button" class="fp-btn" data-act="edit" data-id="' + esc(k.id) + '">' + esc(TEXT.edit) + "</button>" +
      '<button type="button" class="fp-btn fp-danger" data-act="remove" data-id="' + esc(k.id) + '">' + esc(TEXT.remove) + "</button></div></section>";
  }).join("");
  var adding = ui.adding || !S.children.length;
  var editing = S.children.filter(function(k){ return k.id === ui.editing; })[0];
  var form = editing ? childForm(editing) : adding ? childForm() : '<div><button type="button" class="fp-btn fp-primary" data-act="add">+ ' + esc(TEXT.addChild) + "</button></div>";
  return head(TEXT.nav.standard[4][1], false, S.children.length ? "" : esc(TEXT.welcome) + " " + esc(TEXT.noKids)) + memoryWarning() +
    '<div class="fp-stack">' + backupBanner() + (cards ? '<div class="fp-kids">' + cards + "</div>" : "") +
    form +
    '<section class="fp-card"><h2 style="margin-bottom:6px">' + esc(TEXT.backup) + "</h2>" +
    "<p>Progress is saved only in this browser. A backup file is the only way to move it to another device or get it back.</p>" +
    '<div class="fp-row" style="margin-top:10px"><button type="button" class="fp-btn fp-primary" data-act="export">' + esc(TEXT.exportBtn) + "</button>" +
    '<label class="fp-btn" for="fp-import">' + esc(TEXT.importBtn) + '</label><input id="fp-import" type="file" accept=".json,application/json" class="fp-sr" data-act="import"></div>' +
    (ui.msg ? '<p role="status" style="margin-top:8px">' + esc(ui.msg) + "</p>" : "") + "</section>" +
    '<section class="fp-card"><h2 style="margin-bottom:6px">' + esc(TEXT.startOver) + "</h2><p>Removes every child and all progress from this browser.</p>" +
    '<button type="button" class="fp-btn fp-danger" style="margin-top:10px" data-act="reset">' + esc(TEXT.startOver) + "</button></section></div>";
}

/* ----- help ----- */
function screenHelp(){
  var modes = Object.keys(TEXT.modes).map(function(m){
    return '<section class="fp-card"><h3>' + esc(TEXT.modes[m]) + "</h3><p>" + txt("", "Who this mode is for") + "</p></section>"; }).join("");
  var levels = CONTENT.levels.levels.map(function(l){
    return "<li><b>" + esc(l.name) + "</b> (ages " + l.age_guide.min + "–" + l.age_guide.max + "): " + txt(l.age_guide.note, "Placement description") + "</li>"; }).join("");
  var faq = [["How do I print?", "Go to Print, pick one sheet, then press Print. To make a PDF, press Save as PDF and choose “Save as PDF” in the print window. Sheets always print in black and white."],
             ["Where is my progress saved?", "Only in this browser on this device. Nothing is sent anywhere. Clearing your browser data deletes it, so save a backup file now and then (Family → Backup & restore)."],
             ["Can I use another device?", "Yes. Save a backup file on this device, move the file to the other device, and use Restore from file there."],
             ["How do I change a child's mode?", "Pick the child, then change Mode in the side menu. Their progress stays the same."]];
  return head(TEXT.help, true) + '<div class="fp-stack"><h2>Modes</h2><div class="fp-kids">' + modes + "</div>" +
    '<h2>Placement</h2><div class="fp-card"><ul>' + levels + "</ul></div><h2>Questions</h2>" +
    faq.map(function(f){ return "<details><summary>" + esc(f[0]) + "</summary><p>" + esc(f[1]) + "</p></details>"; }).join("") + "</div>";
}

/* ---------- render ---------- */
var root = document.getElementById("fp-app"), sideEl = document.getElementById("fp-side"),
    viewEl = document.getElementById("fp-view"), drillHost = document.getElementById("fp-drillhost");
var drillSynced = null;
function syncDrills(c){
  var key = c.id + "|" + c.level, n = document.getElementById("pd-name"), l = document.getElementById("pd-level");
  if (drillSynced === key || !n || !l) return;
  drillSynced = key; n.value = c.name; l.value = c.level;
  l.dispatchEvent(new Event("change"));
}
function render(focusHead){
  var c = active();
  if (c && !TEXT.nav[c.mode].some(function(n){ return n[0] === ui.screen; }) && ["help","family"].indexOf(ui.screen) < 0) ui.screen = "week";
  if (c && c.mode === "toddler" && ui.screen === "family" && !ui.grown) ui.screen = "week";
  var body;
  if (!c) body = ui.screen === "help" ? screenHelp() : screenFamily();
  else body = ({week:screenWeek, weeks:screenWeeks, print:screenPrint, pieces:screenPieces, stars:screenStars, family:screenFamily, help:screenHelp}[ui.screen] || screenWeek)(c);
  sideEl.innerHTML = sidebar(c);
  viewEl.innerHTML = (ui.screen !== "family" ? memoryWarning() : "") + body;
  drillHost.hidden = !(c && ui.screen === "print" && ui.sheet === "drill");
  if (!drillHost.hidden) syncDrills(c);
  if (focusHead) { var h = document.getElementById("fp-h1"); if (h) h.focus(); }
}

function go(screen){ ui.screen = screen; ui.msg = ""; ui.grown = false; ui.viewWeek = null; ui.editing = null; render(true); }

/* Printing: copy the paper to a direct child of <body> and hide the rest of the page
   (works inside a Squarespace page as well as on its own). */
function makePrintout(){
  var paper = viewEl.querySelector(".fp-paper"); if (!paper) return false;
  removePrintout();
  var out = document.createElement("div"); out.id = "fp-printout"; out.innerHTML = paper.outerHTML;
  document.body.appendChild(out); document.documentElement.classList.add("fp-printing"); return true;
}
function removePrintout(){
  var out = document.getElementById("fp-printout"); if (out) out.remove();
  document.documentElement.classList.remove("fp-printing");
}
window.addEventListener("beforeprint", function(){ if (ui.screen === "print" && ui.sheet !== "drill" && !document.getElementById("fp-printout")) makePrintout(); });
window.addEventListener("afterprint", removePrintout);

function exportBackup(){
  S.lastBackup = new Date().toISOString(); save();
  var data = { app:"family-piano", format:1, exported:S.lastBackup, state:S };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "family-piano-backup-" + S.lastBackup.slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  ui.msg = ""; render();
}
function importBackup(file){
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(r.result);
      if (d.app !== "family-piano" || !d.state || !Array.isArray(d.state.children)) throw 0;
      S = d.state; S.version = 1; save(); ui.msg = TEXT.importOk;
    } catch(e){ ui.msg = TEXT.importBad; }
    render();
  };
  r.readAsText(file);
}
function readAloud(c){
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  readerSteps(c).forEach(function(x, i){
    var u = new SpeechSynthesisUtterance("Step " + (i + 1) + ". " + (x.item.topic || TEXT.strands[x.strand]));
    u.lang = "en-US"; window.speechSynthesis.speak(u);
  });
}

root.addEventListener("click", function(e){
  var t = e.target.closest("[data-go],[data-print],[data-act]"); if (!t || t.tagName === "INPUT" || t.tagName === "SELECT") return;
  var c = active();
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.print) { ui.sheet = t.dataset.print; return go("print"); }
  switch (t.dataset.act) {
    case "weekdone":
      if (c.week >= 12) c.complete = true; else c.week++;
      save(); ui.grown = false; render(true); break;
    case "tile": c.done[t.dataset.id] = !c.done[t.dataset.id]; save(); render(); break;
    case "grown": ui.grown = !ui.grown; render(true); break;
    case "readme": readAloud(c); break;
    case "doprint": ui.msg = t.dataset.pdf ? TEXT.savePdfHint : ""; render(); if (makePrintout()) { window.print(); setTimeout(removePrintout, 1000); } break;
    case "viewweek": ui.viewWeek = parseInt(t.dataset.n, 10); ui.screen = "week"; render(true); break;
    case "backweek": ui.viewWeek = null; render(true); break;
    case "nextlevel": var nx = nextLevelOf(c); if (nx) { c.level = nx.id; c.week = 1; c.complete = false; save(); go("week"); } break;
    case "edit": ui.editing = t.dataset.id; ui.adding = false; render(); break;
    case "filter": ui.filter = t.dataset.f; render(); break;
    case "add": ui.adding = true; render(); break;
    case "cancel": ui.adding = false; ui.editing = null; render(); break;
    case "pick": S.activeId = t.dataset.id; save(); go("week"); break;
    case "remove":
      var k = S.children.filter(function(x){ return x.id === t.dataset.id; })[0];
      if (k && confirm(TEXT.removeConfirm(k.name))) { S.children = S.children.filter(function(x){ return x !== k; }); if (S.activeId === k.id) S.activeId = S.children[0] ? S.children[0].id : null; save(); render(); }
      break;
    case "export": exportBackup(); break;
    case "reset": if (confirm(TEXT.startOverConfirm)) { S = blank(); save(); ui.adding = false; go("family"); } break;
  }
});
root.addEventListener("change", function(e){
  var t = e.target, c = active(), a = t.dataset.act;
  if (a === "tick") { c.done[t.dataset.id] = t.checked; save(); render(); }
  else if (a === "learned") { c.learned[t.dataset.id] = t.checked; save(); render(); }
  else if (a === "who") { S.activeId = t.value; save(); go("week"); }
  else if (a === "mode") { c.mode = t.value; save(); go("week"); }
  else if (a === "sheet") { ui.sheet = t.value; render(); }
  else if (a === "opt") { ui.opts[t.dataset.opt] = t.checked; render(); }
  else if (a === "import" && t.files[0]) importBackup(t.files[0]);
});
root.addEventListener("submit", function(e){
  var f = e.target; if (f.dataset.form !== "child") return; e.preventDefault();
  var el = f.elements, name = el.namedItem("name").value.trim(); if (!name) return;
  var level = el.namedItem("level").value, mode = el.namedItem("mode").value || (level === "pre-reader" ? "toddler" : "standard");
  var week = Math.max(1, Math.min(12, parseInt(el.namedItem("week").value, 10) || 1));
  var age = el.namedItem("age").value;
  var old = S.children.filter(function(x){ return x.id === f.dataset.id; })[0];
  if (old) {
    old.name = name; old.age = age ? parseInt(age, 10) : null; old.mode = mode;
    if (old.level !== level || old.week !== week) old.complete = false;
    old.level = level; old.week = week; save(); ui.editing = null; render(); return;
  }
  var k = { id:uid(), name:name, age:age ? parseInt(age, 10) : null, level:level, mode:mode, week:week, complete:false, done:{}, learned:{} };
  S.children.push(k); S.activeId = k.id; save(); ui.adding = false; go("week");
});

if (!S.children.length) ui.screen = "family";
render();
})();
</script>
