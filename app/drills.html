<!DOCTYPE html>
<meta charset="utf-8">
<title>Piano Drill Sheets</title>
<!--
  Piano drill sheet generator (Phase 1.5, Part B).
  Paste this WHOLE file into a Squarespace Code block (or open it in a browser).
  Rules only, no AI: same seed + same settings = same sheet. See app/DRILL-RULES.md.
  Only outside file: VexFlow 4.2.2 (draws the music), loaded from jsDelivr below.
-->
<div id="pd-drills">
<style>
  #pd-drills { --ink: #000; --paper: #fff; --line: #000; --soft: #555;
    font-family: Helvetica, Arial, sans-serif; color: var(--ink); background: transparent; }
  #pd-drills * { box-sizing: border-box; }
  #pd-drills .pd-controls { max-width: 8.5in; margin: 0 auto 16px; padding: 14px; border: 1px solid #999;
    border-radius: 6px; background: #fafafa; color: #000; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  #pd-drills .pd-controls label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; }
  #pd-drills .pd-controls label.pd-check { flex-direction: row; align-items: center; gap: 8px; }
  #pd-drills .pd-controls input[type=text], #pd-drills .pd-controls input[type=number],
  #pd-drills .pd-controls select { font-size: 15px; padding: 6px; border: 1px solid #888; border-radius: 4px;
    background: #fff; color: #000; width: 100%; }
  #pd-drills .pd-seedrow { display: flex; gap: 6px; }
  #pd-drills .pd-buttons { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; grid-column: 1 / -1; }
  #pd-drills button { font-size: 15px; padding: 8px 14px; border: 1px solid #000; border-radius: 4px;
    background: #fff; color: #000; cursor: pointer; }
  #pd-drills button.pd-primary { background: #000; color: #fff; }
  #pd-drills .pd-msg { max-width: 8.5in; margin: 0 auto 12px; font-size: 14px; color: #000; }
  #pd-drills .pd-msg:empty { display: none; }
  #pd-drills .pd-msg.pd-error { border: 2px solid #000; padding: 8px; font-weight: bold; }

  /* One printed sheet = US Letter. On screen it is drawn as a paper page. */
  #pd-drills .pd-page { width: 8.5in; height: 11in; padding: 0.5in; margin: 0 auto 24px; background: var(--paper);
    box-shadow: 0 1px 6px rgba(0,0,0,.35); display: flex; flex-direction: column; overflow: hidden; color: #000; }
  #pd-drills .pd-head { border-bottom: 3px solid var(--line); padding-bottom: 6px; margin-bottom: 8px; }
  #pd-drills.pd-ink .pd-head { border-bottom-width: 1px; }
  #pd-drills .pd-nameline { display: flex; justify-content: space-between; font-size: 14px; }
  #pd-drills .pd-title { font-size: 22px; font-weight: bold; margin: 6px 0 2px; }
  #pd-drills .pd-instr { font-size: 14px; }
  #pd-drills .pd-keybanner { display: inline-block; border: 2px solid #000; padding: 1px 8px; font-weight: bold;
    font-size: 14px; margin-bottom: 4px; }
  #pd-drills .pd-grid { flex: 1; display: grid; gap: 6px; min-height: 0; }
  #pd-drills .pd-cell { position: relative; min-height: 0; min-width: 0; display: flex; }
  #pd-drills .pd-cell > svg { width: 100%; height: 100%; display: block; }
  #pd-drills .pd-num { position: absolute; left: 0; top: 0; font-size: 13px; font-weight: bold; }
  #pd-drills .pd-foot { display: flex; justify-content: space-between; font-size: 10px; border-top: 1px solid #000;
    padding-top: 4px; margin-top: 6px; gap: 12px; }
  #pd-drills.pd-large .pd-nameline, #pd-drills.pd-large .pd-instr { font-size: 19px; }
  #pd-drills.pd-large .pd-title { font-size: 30px; }
  #pd-drills.pd-large .pd-num { font-size: 18px; }
  #pd-drills.pd-large .pd-foot { font-size: 12px; }

  @page { size: letter; margin: 0.5in; }
  @media print {
    html.pd-printing body > *:not(#pd-drills) { display: none !important; }
    html.pd-printing, html.pd-printing body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
    #pd-drills .pd-controls, #pd-drills .pd-msg, #pd-drills .pd-noprint { display: none !important; }
    #pd-drills .pd-page { width: 7.5in; height: 9.95in; padding: 0; margin: 0; box-shadow: none;
      break-after: page; page-break-after: always; }
    #pd-drills .pd-page:last-child { break-after: auto; page-break-after: auto; }
  }
</style>

<div class="pd-controls">
  <label>Child's name <input type="text" id="pd-name" maxlength="40" placeholder="(optional)"></label>
  <label>Level <select id="pd-level"></select></label>
  <label>Drill type <select id="pd-type"></select></label>
  <label>Option <select id="pd-variant"></select></label>
  <label>Number of items <input type="number" id="pd-count" min="4" max="24" value="12"></label>
  <label>Seed (same seed = same sheet)
    <span class="pd-seedrow"><input type="number" id="pd-seed" min="1" max="4294967295"><button type="button" id="pd-newseed" title="Pick a new random seed">New</button></span>
  </label>
  <label class="pd-check"><input type="checkbox" id="pd-large"> Large print</label>
  <label class="pd-check"><input type="checkbox" id="pd-ink"> Ink-saving black &amp; white</label>
  <label class="pd-check"><input type="checkbox" id="pd-key" checked> Include answer key</label>
  <div class="pd-buttons">
    <button type="button" class="pd-primary" id="pd-make">Make sheet</button>
    <button type="button" id="pd-print">Print</button>
  </div>
</div>
<div class="pd-msg" id="pd-msg"></div>
<div class="pd-sheets" id="pd-sheets"></div>
</div>

  var LEVELS = [

      'level-3': { times: ['2/4', '3/4', '4/4', '6/8'], groups: ['W', 'DH', 'H', 'Q', 'QR', 'HR', 'E2', 'WR', 'DQE', 'RE', 'ER'], syllables: ['numbers', 'kodaly'], ties: true },

      'level-3': { sizes: [2, 3, 4, 5, 6, 7, 8], pres: ['melodic', 'harmonic'], dirs: ['up'], clefs: ['treble', 'bass'], noteLevel: 'level-3',

      'level-4': { sizes: [2, 3, 4, 5, 6, 7, 8], pres: ['melodic', 'harmonic'], dirs: ['up', 'down'], clefs: ['treble', 'bass'], noteLevel: 'level-4',
                   qual: { 2: ['M', 'm'], 3: ['M', 'm'], 4: ['P', 'A'], 5: ['P', 'd'], 6: ['M', 'm'], 7: ['M', 'm'], 8: ['P'] } }
    },
    'key-signatures': {
      'level-2': { keys: ['C', 'G', 'F'], minor: false, clefs: ['treble', 'bass'] },
      'level-3': { keys: ['C', 'G', 'D', 'F', 'Bb'], minor: false, clefs: ['treble', 'bass'] },
      'level-4': { keys: ['C', 'G', 'D', 'A', 'E', 'F', 'Bb', 'Eb', 'Ab'], minor: true, clefs: ['treble', 'bass', 'grand'] }
    },

      'level-2': { octaves: [2], tasks: ['label-white', 'mark-note', 'label-black'] },
      'level-3': { octaves: [2, 3], tasks: ['label-white', 'mark-note', 'label-black', 'half-whole'] },

  var DRILLS = [
    { id: 'note-naming', name: 'Note naming' }, { id: 'keyboard', name: 'Keyboard geography' },
    { id: 'rhythm', name: 'Rhythm counting' }, { id: 'intervals', name: 'Interval identification' },
    { id: 'key-signatures', name: 'Key signatures' }, { id: 'prereader', name: 'Pre-reader: high/low, long/short, step/skip' }
  ];
  var VARIANT_NAMES = {
    treble: 'Treble clef', bass: 'Bass clef', grand: 'Grand staff', mixed: 'Mixed',
    numbers: 'Counts (1 & 2 &)', kodaly: 'Kodály syllables (ta, ti-ti)',
    'groups2': 'Groups of 2 black keys', 'groups3': 'Groups of 3 black keys', 'highlow': 'High / low side',
    'label-white': 'Name white keys', 'label-black': 'Name black keys', 'mark-note': 'Mark every …',
    'half-whole': 'Half / whole steps', 'longshort': 'Long / short', 'stepskip': 'Step / skip'
  };
  /* Items per page: [columns, rows] for normal and large print. */
  var LAYOUT = {
    'note-naming': { normal: [4, 5], large: [3, 4] }, 'intervals': { normal: [3, 5], large: [2, 4] },
    'key-signatures': { normal: [4, 5], large: [3, 4] }, 'rhythm': { normal: [1, 7], large: [1, 5] },
    'keyboard-1': { normal: [2, 6], large: [2, 4] }, 'keyboard': { normal: [1, 6], large: [1, 4] },

  };

  /* ============================================================
     3. SEEDED RANDOM NUMBERS (mulberry32). Same seed -> same numbers.
     ============================================================ */
  function makeRng(seed) {
    var a = seed >>> 0;
    function next() {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    return {
      next: next,
      int: function (n) { return Math.floor(next() * n); },
      pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
      chance: function (p) { return next() < p; },
      weighted: function (arr, w) {
        var total = 0, i; for (i = 0; i < arr.length; i++) total += w(arr[i]);
        var r = next() * total;
        for (i = 0; i < arr.length; i++) { r -= w(arr[i]); if (r < 0) return arr[i]; }
        return arr[arr.length - 1];
      }
    };
  }

  /* ============================================================
     4. MUSIC HELPERS
     A pitch is {l: letter index 0-6 (C..B), acc: -1/0/1, o: octave}.
     ============================================================ */
  var LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  var NAT = [0, 2, 4, 5, 7, 9, 11];
  var STAFF_BOTTOM = { treble: 30, bass: 18 }; // E4 and G2 as letter steps
  function P(s) { return { l: LETTERS.indexOf(s[0]), acc: 0, o: parseInt(s.slice(1), 10) }; }
  function dia(p) { return p.o * 7 + p.l; }
  function fromDia(d) { return { l: ((d % 7) + 7) % 7, acc: 0, o: Math.floor(d / 7) }; }
  function semis(p) { return p.o * 12 + NAT[p.l] + p.acc; }
  function accSym(a) { return a === 1 ? '♯' : a === -1 ? '♭' : ''; }
  function pname(p) { return LETTERS[p.l] + accSym(p.acc); }
  function vfKey(p) { return LETTERS[p.l].toLowerCase() + (p.acc === 1 ? '#' : p.acc === -1 ? 'b' : '') + '/' + p.o; }
  function ledgers(d, clef) {
    var b = STAFF_BOTTOM[clef], t = b + 8;
    if (d < b) return Math.floor((b - d) / 2);
    if (d > t) return Math.floor((d - t) / 2);
    return 0;
  }
  function grandClef(d) { return d >= 28 ? 'treble' : 'bass'; } // middle C and up: treble staff
  function oddAcc(p) { // E#, B#, Cb, Fb are skipped at these levels
    return (p.acc === 1 && (p.l === 2 || p.l === 6)) || (p.acc === -1 && (p.l === 0 || p.l === 3));
  }
  function sameP(a, b) { return a && b && a.l === b.l && a.acc === b.acc && a.o === b.o; }

  /* Natural notes allowed for a clef at a level (range + ledger-line limit). */
  function notePool(lim, clef) {
    var r = Array.isArray(lim.range) ? lim.range : lim.range[clef];
    var out = [];
    for (var d = dia(P(r[0])); d <= dia(P(r[1])); d++) {
      var staff = clef === 'grand' ? grandClef(d) : clef;
      if (ledgers(d, staff) <= lim.ledger) out.push(fromDia(d));
    }
    return out;
  }

  /* ============================================================
     5. GENERATORS. Each returns a list of items (same seed -> same list).
     ============================================================ */
  function genNoteNaming(rng, level, clef, count) {
    var lim = LIMITS['note-naming'][level];
    var pool = notePool(lim, clef);
    var kind = lim.acc === 'sharps-or-flats' ? (rng.chance(0.5) ? 1 : -1) : 0;
    var items = [], prev = null;
    for (var i = 0; i < count; i++) {
      var p, tries = 0;
      do {
        p = Object.assign({}, rng.pick(pool));
        if (lim.acc !== 'none' && rng.chance(0.35)) {
          p.acc = lim.acc === 'both' ? (rng.chance(0.5) ? 1 : -1) : kind;
          if (oddAcc(p)) p.acc = 0;
        }
        tries++;
      } while (sameP(p, prev) && tries < 20);
      prev = p;
      items.push({ clef: clef, staff: clef === 'grand' ? grandClef(dia(p)) : clef, p: p, answer: pname(p) });
    }
    return items;
  }

  var QUAL_NAME = { M: 'major', m: 'minor', P: 'perfect', A: 'augmented', d: 'diminished' };
  var ORD = { 2: '2nd', 3: '3rd', 4: '4th', 5: '5th', 6: '6th', 7: '7th', 8: '8th (octave)' };
  function quality(size, st) {
    var base = [0, 0, 2, 4, 5, 7, 9, 11, 12][size];
    var diff = st - base;
    if (size === 4 || size === 5 || size === 8) return { '0': 'P', '1': 'A', '-1': 'd' }[diff] || null;
    return { '0': 'M', '-1': 'm', '1': 'A', '-2': 'd' }[diff] || null;
  }
  function genIntervals(rng, level, clef, count) {
    var lim = LIMITS.intervals[level];
    var nl = LIMITS['note-naming'][lim.noteLevel];
    var pool = notePool(nl, clef);
    var maxD = Math.max.apply(null, pool.map(dia)), minD = Math.min.apply(null, pool.map(dia));
    var items = [], prevKey = '';
    for (var i = 0; i < count; i++) {
      var item = null, tries = 0;
      while (!item && tries < 400) {
        tries++;
        var size = rng.pick(lim.sizes);
        var quals = lim.qual ? lim.qual[size] : null;
        var want = quals ? rng.pick(quals) : null;
        var lo = Object.assign({}, rng.pick(pool));
        var hiD = dia(lo) + size - 1;
        if (hiD > maxD || hiD < minD) continue;
        var hi = fromDia(hiD);
        if (want) { // choose the top note's sharp/flat so the quality matches
          var target = { M: 0, m: -1, P: 0, A: 1, d: -1 }[want] + [0, 0, 2, 4, 5, 7, 9, 11, 12][size];
          hi.acc = target - (semis(hi) - semis(lo));
          if (Math.abs(hi.acc) > 1 || oddAcc(hi)) continue;
          if (hi.acc !== 0 && nl.acc === 'none') continue;
        } else if (lim.qual) { // number only (e.g. 6th/7th at level 3): white keys only
          hi.acc = 0;
        }
        var q = quality(size, semis(hi) - semis(lo));
        if (!q) continue;
        var dir = rng.pick(lim.dirs);
        var pres = rng.pick(lim.pres);
        var key = vfKey(lo) + vfKey(hi) + dir + pres;
        if (key === prevKey) continue;
        prevKey = key;
        var label = want ? (want + size) : ORD[size].split(' ')[0];
        var words = want ? (QUAL_NAME[want] + ' ' + ORD[size]) : ORD[size];
        item = { clef: clef, lo: lo, hi: hi, dir: dir, pres: pres, answer: label,
                 answerLong: words + (dir === 'down' && pres === 'melodic' ? ', going down' : '') };
      }
      if (item) items.push(item);
    }
    return items;
  }

  var RELATIVE_MINOR = { C: 'A', G: 'E', D: 'B', A: 'F♯', E: 'C♯', F: 'D', Bb: 'G', Eb: 'C', Ab: 'F' };
  function genKeySigs(rng, level, clef, count) {
    var lim = LIMITS['key-signatures'][level];
    var items = [], prev = null;
    for (var i = 0; i < count; i++) {
      var k, tries = 0;
      do { k = rng.pick(lim.keys); tries++; } while (k === prev && tries < 20);
      prev = k;
      var maj = k.replace('b', '♭');

    }
    return items;
  }

  /* Rhythm building blocks. len = length in beats (simple time) or eighths (6/8).
     c = how the counts are written, k = Kodály syllables. B = beat number. */
  var GROUPS = {
    W:   { len: 4, notes: ['w'], c: ['B-+1-+2-+3'], k: ['ta-a-a-a'], start: [1], times: ['4/4'] },
    WR:  { len: 'bar', notes: ['wr'], c: ['(BAR)'], k: ['(rest)'], start: [1], rest: true },
    DH:  { len: 3, notes: ['hd'], c: ['B-+1-+2'], k: ['ta-a-a'], start: [1], times: ['3/4', '4/4'] },
    H:   { len: 2, notes: ['h'], c: ['B-+1'], k: ['ta-a'], start: [1, 2, 3], times: ['2/4', '3/4', '4/4'] },
    HR:  { len: 2, notes: ['hr'], c: ['(B-+1)'], k: ['(rest)'], start: [1, 3], times: ['2/4', '4/4'], rest: true },
    Q:   { len: 1, notes: ['q'], c: ['B'], k: ['ta'] },
    QR:  { len: 1, notes: ['qr'], c: ['(B)'], k: ['(rest)'], rest: true },
    E2:  { len: 1, notes: ['8', '8'], c: ['B', '&'], k: ['ti', 'ti'], beam: true },
    DQE: { len: 2, notes: ['qd', '8'], c: ['B-+1', '&'], k: ['tam', 'ti'], start: [1, 2, 3] },
    RE:  { len: 1, notes: ['8r', '8'], c: ['(B)', '&'], k: ['(rest)', 'ti'] },
    ER:  { len: 1, notes: ['8', '8r'], c: ['B', '(&)'], k: ['ti', '(rest)'] },
    S4:  { len: 1, notes: ['16', '16', '16', '16'], c: ['B', 'e', '&', 'a'], k: ['ti', 'ka', 'ti', 'ka'], beam: true },

      shape(svg, it.shape, 40, ys[0], 14, ink); el('rect', { x: 60, y: ys[0] - 7, width: 230, height: 14, fill: ink ? '#fff' : '#000', stroke: '#000', 'stroke-width': 3 }, svg);
      shape(svg, it.shape, 40, ys[1], 14, ink); el('rect', { x: 60, y: ys[1] - 7, width: 55, height: 14, fill: ink ? '#fff' : '#000', stroke: '#000', 'stroke-width': 3 }, svg);
      if (key) { var ry = it.ask === 'long' ? ys[0] : ys[1], right = it.ask === 'long' ? 300 : 125; ring(svg, (18 + right) / 2, ry, (right - 18) / 2, 24); }
    } else {
      txt(svg, W / 2, 28, TEXT.pre.stepskip, 18, { bold: true });
      var stairs = 4, sw = 50, sh = 24, sx = 60, sy = 150;
      var d = 'M' + sx + ' ' + sy;
      for (var i = 0; i < stairs; i++) d += ' H' + (sx + (i + 1) * sw) + ' V' + (sy - (i + 1) * sh);
      el('path', { d: d, fill: 'none', stroke: '#000', 'stroke-width': 2 }, svg);
      var a = it.start, b2 = it.start + (it.skip ? 2 : 1);
      if (!it.up) { var t = a; a = stairs - 1 - t; b2 = stairs - 1 - (t + (it.skip ? 2 : 1)); }
      [a, b2].forEach(function (s) { shape(svg, it.shape, sx + s * sw + sw / 2, sy - s * sh - 14, 11, ink); });
      txt(svg, 90, 192, 'STEP', 18, { bold: true }); txt(svg, 230, 192, 'SKIP', 18, { bold: true });
      if (key) ring(svg, it.skip ? 230 : 90, 186, 42, 18);
    }
  }

  /* ============================================================
     7. PAGES, CONTROLS, PRINT
     ============================================================ */
  var $ = function (id) { return document.getElementById(id); };
  var ROOT = $('pd-drills');

  function available(level) {
    return DRILLS.filter(function (d) { return LIMITS[d.id][level]; });
  }
  function variantsFor(drill, level) {
    var lim = LIMITS[drill][level];
    if (drill === 'note-naming' || drill === 'intervals' || drill === 'key-signatures') return lim.clefs;
    if (drill === 'rhythm') return lim.syllables;
    if (drill === 'keyboard') return ['mixed'].concat(lim.tasks);
    if (drill === 'prereader') return ['mixed'].concat(lim.kinds);
    return ['mixed'];
  }
  function fill(select, list, names, keep) {
    select.innerHTML = '';
    list.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v.id || v; o.textContent = v.name || names[v] || v;
      select.appendChild(o);
    });
    if (keep && list.some(function (v) { return (v.id || v) === keep; })) select.value = keep;
  }
  function refreshMenus() {
    var level = $('pd-level').value;
    fill($('pd-type'), available(level), {}, $('pd-type').value);
    fill($('pd-variant'), variantsFor($('pd-type').value, level), VARIANT_NAMES, $('pd-variant').value);
  }
  function newSeed() { $('pd-seed').value = 1 + Math.floor(Math.random() * 999999); }

  function settings() {
    var count = Math.max(4, Math.min(24, parseInt($('pd-count').value, 10) || 12));
    $('pd-count').value = count;
    var seed = parseInt($('pd-seed').value, 10);
    if (!(seed >= 1 && seed <= 4294967295)) { newSeed(); seed = parseInt($('pd-seed').value, 10); }
    return { name: $('pd-name').value.trim(), level: $('pd-level').value, drill: $('pd-type').value,
             variant: $('pd-variant').value, count: count, seed: seed,
             large: $('pd-large').checked, ink: $('pd-ink').checked, key: $('pd-key').checked };
  }

  function generate(st) {
    var rng = makeRng(st.seed);
    switch (st.drill) {
      case 'note-naming': return genNoteNaming(rng, st.level, st.variant, st.count);
      case 'intervals': return genIntervals(rng, st.level, st.variant, st.count);
      case 'key-signatures': return genKeySigs(rng, st.level, st.variant, st.count);
      case 'rhythm': return genRhythm(rng, st.level, st.variant, st.count);
      case 'keyboard': return genKeyboard(rng, st.level, st.variant, st.count);
      case 'prereader': return genPrereader(rng, st.level, st.variant, st.count);
    }
    return [];
  }
  var DRAW = { 'note-naming': drawNoteNaming, 'intervals': drawInterval, 'key-signatures': drawKeySig,
               'rhythm': drawRhythm, 'keyboard': drawKeyboard, 'prereader': drawPrereader };

  function sheetCode(st) {
    var lvl = LEVELS.filter(function (l) { return l.id === st.level; })[0].name;
    var drill = DRILLS.filter(function (d) { return d.id === st.drill; })[0].name.split(':')[0];
    return 'Seed ' + st.seed + ' · ' + lvl + ' · ' + drill + ' (' + (VARIANT_NAMES[st.variant] || st.variant) + ') · ' + st.count + ' items';
  }
  function instruction(st) {
    if (st.drill === 'rhythm') {
      if (LIMITS.rhythm[st.level].sticks) return TEXT.instr['rhythm-sticks'];
      return st.variant === 'kodaly' ? TEXT.instr['rhythm-kodaly'] : TEXT.instr.rhythm;
    }
    return TEXT.instr[st.drill];
  }

  function makePage(st, pageNo, pageCount, isKey, cols, rows) {
    var page = document.createElement('section');
    page.className = 'pd-page';
    var head = document.createElement('div'); head.className = 'pd-head';
    var name = st.name ? st.name : '_______________________';
    head.innerHTML = (isKey ? '<div class="pd-keybanner"></div>' : '') +
      '<div class="pd-nameline"><span></span><span>' + TEXT.dateLabel + ' ____________</span></div>' +
      '<div class="pd-title"></div><div class="pd-instr"></div>';
    if (isKey) head.querySelector('.pd-keybanner').textContent = TEXT.keyTitle;
    head.querySelector('.pd-nameline span').textContent = TEXT.nameLabel + ' ' + name;
    head.querySelector('.pd-title').textContent = TEXT.titles[st.drill];
    head.querySelector('.pd-instr').textContent = instruction(st);
    var grid = document.createElement('div'); grid.className = 'pd-grid';
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
    var foot = document.createElement('div'); foot.className = 'pd-foot';
    var left = document.createElement('span'); left.textContent = sheetCode(st) + (isKey ? ' · answer key' : '');
    var right = document.createElement('span');
    right.textContent = (RULES_STATUS === 'approved' ? '' : TEXT.draft + ' · ') + 'Page ' + pageNo + ' of ' + pageCount;
    foot.appendChild(left); foot.appendChild(right);
    page.appendChild(head); page.appendChild(grid); page.appendChild(foot);
    return { page: page, grid: grid };
  }

  function render() {
    var msg = $('pd-msg');
    msg.className = 'pd-msg'; msg.textContent = '';
    if (!window.Vex || !Vex.Flow) {
      msg.className = 'pd-msg pd-error';
      msg.textContent = 'The music drawing library (VexFlow) did not load. Check the internet connection and reload the page.';
      return;
    }
    var st = settings();
    ROOT.classList.toggle('pd-large', st.large);
    ROOT.classList.toggle('pd-ink', st.ink);
    var items = generate(st);
    if (items.length < st.count) msg.textContent = 'Only ' + items.length + ' different items fit these level limits.';
    var lay = st.drill === 'keyboard' && LIMITS.keyboard[st.level].octaves.every(function (o) { return o === 1; }) ? LAYOUT['keyboard-1'] : LAYOUT[st.drill];
    var cr = st.large ? lay.large : lay.normal, per = cr[0] * cr[1];
    var pages = Math.ceil(items.length / per);
    var out = $('pd-sheets');
    out.innerHTML = '';
    var passes = st.key ? [false, true] : [false];
    passes.forEach(function (isKey) {
      for (var p = 0; p < pages; p++) {
        var pg = makePage(st, p + 1, pages, isKey, cr[0], cr[1]);
        out.appendChild(pg.page);
        items.slice(p * per, (p + 1) * per).forEach(function (it, i) {
          var cell = document.createElement('div'); cell.className = 'pd-cell';
          var num = document.createElement('span'); num.className = 'pd-num'; num.textContent = (p * per + i + 1) + '.';
          pg.grid.appendChild(cell);
          DRAW[st.drill](cell, it, isKey, st.ink);
          cell.appendChild(num);
          // Inside the Family Piano app: let it add an on-screen Play button (never printed).
          if (window.fpDrillPlay) window.fpDrillPlay(cell, st.drill, it, p * per + i + 1);
        });
      }
    });
  }

  /* Printing: move the sheets to the top of the page and hide everything else
     (works inside a Squarespace page as well as on its own). */
  var placeholder = null;
  function beforePrint() {
    // Inside the Family Piano app the maker sits in a hidden panel until "Drill sheet" is picked.
    if (placeholder || ROOT.closest('[hidden]')) return;
    placeholder = document.createComment('pd-drills');
    ROOT.parentNode.insertBefore(placeholder, ROOT);
    document.body.appendChild(ROOT);
    document.documentElement.classList.add('pd-printing');
  }
  function afterPrint() {
    if (!placeholder) return;
    placeholder.parentNode.insertBefore(ROOT, placeholder);
    placeholder.parentNode.removeChild(placeholder);
    placeholder = null;
    document.documentElement.classList.remove('pd-printing');
  }
  window.addEventListener('beforeprint', beforePrint);
  window.addEventListener('afterprint', afterPrint);

  function init() {
    fill($('pd-level'), LEVELS, {});
    $('pd-level').value = 'level-1';
    refreshMenus();
    newSeed();
    $('pd-level').addEventListener('change', function () { refreshMenus(); render(); });
    $('pd-type').addEventListener('change', function () { refreshMenus(); render(); });
    ['pd-variant', 'pd-large', 'pd-ink', 'pd-key'].forEach(function (id) { $(id).addEventListener('change', render); });
    $('pd-make').addEventListener('click', render);
    $('pd-newseed').addEventListener('click', function () { newSeed(); render(); });
    $('pd-print').addEventListener('click', function () { render(); beforePrint(); window.print(); setTimeout(afterPrint, 500); });
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

  /* For testing only: lets a test page check that the same seed gives the same items. */
  window.__pdDrills = { generate: generate, makeRng: makeRng,
    toMidi: function (p) { return semis(p) + 12; }, // C4 (middle C) = 60
    redraw: function () { if ($('pd-sheets').childNodes.length) render(); } };
})();
</script>
